# Recorded departures from the guardrails pinned at docs/guardrails/.
#
# Field definitions: https://github.com/pirlruc/guardrails#deviation-rule
# Approval flow:     https://github.com/pirlruc/methodologies/blob/1.5.0/github-issue-adr/docs/process/guardrail-compliance.md
#
# Being stricter than the org default is always allowed and needs no entry here.

deviations:
  # DOCKER-PERF-001 image_max_size_mb deviations retired: ci-container is a CI
  # toolchain image and uses ci_image_max_size_mb (2000) via size_class=ci_toolchain
  # (DOCKER-PERF-002 / CDO-PIN-001).
  - id: SC-SIGN-001
    why: >-
      Private Free-plan repository; Sigstore keyless signing is unavailable.
      Publish sets sign=false until the repo is public or a signing key is
      provisioned. Documented Free-plan pattern in guardrails 1.6.0
      supply-chain/guardrails.md.
    epic: CDO-PIN-001
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2026-12-31
  - id: SC-PROV-001
    why: >-
      Private Free-plan repository; provenance attestation is unavailable.
      container-publish.yml keeps provenance: false / sbom: false on
      build-push-action; actions/attest-build-provenance runs only when sign
      is true (public repos).
    epic: CDO-PIN-001
    owner: pirlruc
    approved_by: Engineering Lead
    review: 2026-12-31
