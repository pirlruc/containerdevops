      - id: CDO-WF-003
        status: done
        title: "container-publish latest-tag gate is false on schedule events"
        overview:
          problem: >-
            container-publish.yml enables the `latest` tag when
            `inputs.tag_latest || github.ref == format('refs/heads/{0}',
            github.event.repository.default_branch)`. `github.event.repository`
            is populated for push/pull_request/release but is absent on
            schedule events (an undocumented expression-context gap), so the
            comparison evaluates against `refs/heads/` and monthly
            DOCKER-BUILD-006 rebuilds never publish `latest` unless the caller
            explicitly passes `tag_latest: true`. The in-repo
            ci-container-image.yml caller triggers publish on schedule with
            `tag_latest` wired only to release events, so scheduled ci-container
            rebuilds silently skip the `latest` tag. Tag `type=sha` is
            unaffected.
          goal: >-
            Publish `latest` on default-branch events using only contexts that
            exist on every event (`github.ref_name`/`github.ref` against
            `github.event_name`, never `github.event.repository` in reusable
            workflows); record the schedule-context gap as a comment so the
            next reviewer does not reintroduce it; align the in-repo caller's
            `tag_latest` wiring.
        architecture:
          target: .github/workflows/container-publish.yml
          modules:
            - .github/workflows/container-publish.yml
            - .github/workflows/ci-container-image.yml
            - docs/workflows.md
        acceptance_criteria:
          - No `github.event.repository` reference remains in the reusable
            workflow tag logic (push/release/schedule-safe expression)
          - >-
            A workflow_dispatch/schedule run on main emits the `latest` tag
            without the caller passing `tag_latest: true`
          - ci-container-image.yml tag_latest wiring matches the new contract
        guardrail_refs:
          - CI-027
          - DOCKER-DELIV-001
        tasks:
          - id: CDO-WF-003-T1
            status: done
            title: Make latest-tag enablement schedule-safe and align caller
            instructions:
              files:
                - .github/workflows/container-publish.yml
                - .github/workflows/ci-container-image.yml
                - docs/workflows.md
            verification:
              - "! grep -q 'github.event.repository' .github/workflows/container-publish.yml"
              - actionlint .github/workflows/container-publish.yml .github/workflows/ci-container-image.yml
              - grep -n 'tag_latest' docs/workflows.md
            guardrail_refs:
              - CI-027

      - id: CDO-IMG-003
        status: done
        title: Refresh ci-container donor digests and prune .trivyignore.yaml
        overview:
          problem: >-
            docker/ci-container/.trivyignore.yaml is stamped "Review:
            2026-11-11 (CDO-015)" — roughly 60 days out — and the donor
            binaries it suppresses (wagoodman/dive:v0.13.1 and
            container-structure-test 1.22.1, both COPY --from digest-pinned
            CI-026) have not been re-checked since CDO-015. The local-parity
            fallback images in check-container-local.sh (hadolint 2.12.0-alpine,
            trivy 0.73.0, dive v0.13.1, structure-test 1.22.1) are
            version-pinned tags only, while the Dockerfile donors are
            digest-pinned — the two paths drift silently. Related: KICS is
