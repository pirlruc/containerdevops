      - id: CDO-WF-002
        status: done
        title: Variant tagging and multi-scan artifact uniqueness
        overview:
          problem: >-
            Parallel image variants (and blocking + posture scans in one run) collide
            on hardcoded artifact names (container-image, container-scan-results) and
            overwrite each other in code scanning under a shared SARIF category.
            ci-container-image.yml also had an always-true blocking expression and a
            stale tagged CI_BASE pin.
          goal: >-
            Additive artifact_name / results_artifact / sarif_category inputs on
            build and scan; tag_suffix + tag_alias_unsuffixed on publish so a
            lower-vulnerability variant can own unsuffixed tags; fix blocking and
            digest-pin CI_BASE on the ci-container caller.
        architecture:
          target: container-build/scan/publish + ci-container-image.yml + workflows.md
          modules:
            - .github/workflows/container-build.yml
            - .github/workflows/container-scan.yml
            - .github/workflows/container-publish.yml
            - .github/workflows/ci-container-image.yml
            - docs/workflows.md
        acceptance_criteria:
          - artifact_name / results_artifact / sarif_category inputs default to legacy names
          - tag_suffix empty preserves unsuffixed-only publish behaviour
          - tag_alias_unsuffixed publishes the unsuffixed set only when a suffix is set
          - ci-container-image.yml blocking expression matches the workflow_dispatch pattern
          - CI_BASE default is digest-pinned to ci-lint 3.0.0
          - docs/workflows.md documents the variant-tagging contract
        guardrail_refs:
          - CI-026
          - DOCKER-DELIV-001
