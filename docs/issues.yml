      - id: CDO-IMG-001
        status: done
        title: Variant hardening and ci-container local/CI parity
        overview:
          problem: >-
            Parallel variant builds share one BuildKit GHA cache; both variants race
            on Hub Overview sync; ci-container lacks .dockerignore and a wired
