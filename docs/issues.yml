            verification:
              - "! bash -c 'REF=abc123; sed \"s|PLACEHOLDER_SHA|${REF}|g\" templates/ci-container.yml | grep -q PLACEHOLDER_SHA'"
              - grep -q 'scripts_ref' templates/ci-container.yml
            guardrail_refs:
