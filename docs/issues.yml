      - id: CDO-WF-004
        status: done
        title: Threshold and pin drift in scan/seed tooling (grype, scripts_ref, KICS)
        overview:
          problem: >-
            Three least-friction defects persist after CDO-WF-002/CDO-SEC-001.
            (1) container-scan.yml reads vuln_fail_on_severity for Trivy but hardcodes
            grype --fail-on high, so an org or repo override of vuln_fail_on_severity
            never reaches the SBOM gate (same class as a hadolint threshold being
            ignored). (2) scripts/sync-container-tooling.sh substitutes only
            @PLACEHOLDER_SHA, leaving three bare scripts_ref: PLACEHOLDER_SHA lines in
            templates/ci-container.yml; a seeded consumer therefore breaks the
            required uses:/scripts_ref lockstep and a private cross-repo caller fails
            the scripts sparse-checkout at startup. (3) The KICS donor image digest
            (KICS_IMAGE env in container-iac.yml) is not covered by any Dependabot
            ecosystem, so it never appears in the monthly all-dependencies PR and
            drifts silently.
          goal: >-
            Read the grype fail-on severity from the vendored thresholds like Trivy;
            make sync-container-tooling replace every PLACEHOLDER_SHA occurrence;
            register the KICS pin for dependency updates (or record a justified
            Dependabot limitation). No change to CI-024/CI-025 or SHA-pin contracts.
        architecture:
          target: container-scan.yml + sync-container-tooling.sh + dependabot.yml
          modules:
            - .github/workflows/container-scan.yml
            - scripts/sync-container-tooling.sh
            - templates/ci-container.yml
            - .github/dependabot.yml
        acceptance_criteria:
          - grype fail-on derives from vuln_fail_on_severity (same source as Trivy SEV)
          - sync-container-tooling output contains no residual PLACEHOLDER_SHA tokens
          - KICS_IMAGE digest is covered by a Dependabot ecosystem or a documented limitation
        guardrail_refs:
          - DOCKER-SEC-001
          - CI-018
        tasks:
          - id: CDO-WF-004-T1
            status: done
            title: Read grype fail-on severity from vendored thresholds
            instructions:
              files:
                - .github/workflows/container-scan.yml
            verification:
              - "! grep -q -- '--fail-on high' .github/workflows/container-scan.yml"
              - grep -q 'vuln_fail_on_severity' .github/workflows/container-scan.yml
            guardrail_refs:
              - DOCKER-SEC-001
          - id: CDO-WF-004-T2
            status: done
            title: Fix sync-container-tooling sed to replace all PLACEHOLDER_SHA tokens
            instructions:
              files:
