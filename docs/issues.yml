      - id: CDO-PIN-019
        status: done
        title: Record Free-plan CI-032 and REL-PUB-004 deviations
        overview:
          problem: >-
            Guardrails 1.9.0 requires branch protection and tag-restricted publish
            Environments. A user-owned private Free-plan repository cannot use either,
            and this repository is going private again.
          goal: Record both deviations instead of applying settings that will not survive.
        decision: >-
          In the context of a repository that returns to private on the Free plan,
          facing CI-032 and REL-PUB-004, we decided to record deviations and keep
          SHA pins plus repository secrets, to achieve a private-compatible setup,
          accepting that publish tokens stay readable by jobs in this repository.
        architecture:
          target: docs/guardrail-deviations.yml
          modules:
            - docs/guardrail-deviations.yml
        acceptance_criteria:
          - CI-032 and REL-PUB-004 are recorded with a future review date
          - No ruleset or Environment is created
        guardrail_refs:
          - CI-032
          - REL-PUB-004
        tasks:
          - id: CDO-PIN-019-T1
            status: done
            title: Add the Free-plan deviations
            instructions:
              files:
                - docs/guardrail-deviations.yml
            verification:
              - grep -q CI-032 docs/guardrail-deviations.yml
              - grep -q REL-PUB-004 docs/guardrail-deviations.yml
            guardrail_refs:
              - CI-032
              - REL-PUB-004

      - id: CDO-LOCAL-001
        status: done
        title: Allow a local image scan that does not push to GHCR
        overview:
          problem: >-
            container-build and container-scan handed off by GHCR digest only.
            A product repo that builds a local tag and does not publish could not
            scan it. Tag 5.0.4 has no GitHub Release.
          goal: >-
            An opt-in local scan that does not push, and docs that call 5.0.4 tag-only.
        decision: >-
          In the context of unpublished product images, facing a scan path that
          always pushed, we decided scan_local plus push_handoff false, to achieve
          DOCKER-SEC-001 without a registry write, accepting that published images
          keep the digest handoff and the image tar stays removed.
        out_of_scope:
          - Deleting published GHCR tags
          - Restoring the image.tar artifact
        architecture:
          target: container-build and container-scan
          modules:
            - .github/workflows/container-build.yml
            - .github/workflows/container-scan.yml
            - scripts/scan-image.sh
            - docs/workflows.md
        acceptance_criteria:
          - container-build can scan a loaded image when push_handoff is false
          - The default remains the GHCR digest handoff
          - workflows.md names KICS 698ed579 as the one-shot healthcheck query
          - Docs call 5.0.4 tag-only instead of citing a missing Release
        guardrail_refs:
          - DOCKER-SEC-001
          - DOCKER-DELIV-004
          - DOCKER-COMPOSE-002
          - REL-PUB-001
        tasks:
          - id: CDO-LOCAL-001-T1
            status: done
            title: Add the local scan path and the KICS one-shot note
            instructions:
              files:
                - .github/workflows/container-build.yml
                - scripts/scan-image.sh
                - docs/workflows.md
            verification:
              - grep -q scan_local .github/workflows/container-build.yml
              - grep -q 698ed579 docs/workflows.md
            guardrail_refs:
              - DOCKER-SEC-001
              - DOCKER-COMPOSE-002

      - id: CDO-LINT-001
        status: done
        title: Lint a list of unpublished Dockerfiles
        overview:
          problem: >-
            container-lint and container-devcontainer each took one Dockerfile.
            Molecule and devcontainer fixtures need hadolint without a build or publish.
          goal: A newline-separated dockerfiles input runs hadolint at the docker threshold.
        decision: >-
          In the context of fixture Dockerfiles, facing a single-file input, we decided
          a dockerfiles list on the existing lint workflows, to achieve DOCKER-LINT-001
          without a product-image build, accepting that callers still cannot use a
          private workflow from a public repository once this repo is private again.
        architecture:
          target: container-lint and container-devcontainer
          modules:
            - .github/workflows/container-lint.yml
            - .github/workflows/container-devcontainer.yml
            - scripts/lint-dockerfiles.sh
        acceptance_criteria:
          - dockerfiles replaces dockerfile when set
          - hadolint uses hadolint_failure_threshold
        guardrail_refs:
          - DOCKER-LINT-001
        tasks:
          - id: CDO-LINT-001-T1
            status: done
            title: Accept a newline-separated Dockerfile list
            instructions:
              files:
                - .github/workflows/container-lint.yml
                - scripts/lint-dockerfiles.sh
            verification:
              - grep -q dockerfiles .github/workflows/container-lint.yml
            guardrail_refs:
              - DOCKER-LINT-001

      - id: CDO-QUOTA-002
        status: done
        title: Stop writing BuildKit caches on pull and tag refs
        overview:
          problem: >-
            cache-to type=gha wrote a full layer cache on every pull-request
            and tag ref. Those copies cannot be restored by main and were the
            bulk of Actions storage.
          goal: >-
            Write the cache only from the default branch, and sweep leftover
            pull and tag caches.
        decision: >-
          In the context of Actions quota, facing per-ref BuildKit caches, we
          decided cache-to runs only on the default branch and the sweeper
          deletes pull and tag caches, to achieve storage that does not grow
          with every pull request, accepting that the first build on main after
          a cold cache is slower.
        out_of_scope:
          - Deleting published GHCR or Docker Hub tags
          - Deleting container-scan or supply-chain result artifacts
        architecture:
          target: container build, publish, and the artifact sweep
          modules:
            - .github/workflows/container-build.yml
            - .github/workflows/container-publish.yml
            - .github/workflows/artifact-sweep.yml
        acceptance_criteria:
          - cache-to is empty unless the ref is the default branch
          - The sweep deletes caches whose ref is a pull or a tag
        guardrail_refs:
          - CI-004
          - DOCKER-DELIV-004
        tasks:
          - id: CDO-QUOTA-002-T1
            status: done
            title: Gate cache-to and sweep stale caches
            instructions:
              files:
                - .github/workflows/container-build.yml
                - .github/workflows/container-publish.yml
                - .github/workflows/artifact-sweep.yml
            verification:
              - grep -q default_branch .github/workflows/container-build.yml
              - grep -q actions/caches .github/workflows/artifact-sweep.yml
            guardrail_refs:
              - CI-004
