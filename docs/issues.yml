# Authored backlog for containerdevops.
#
# Schema: https://github.com/pirlruc/github-scaffold/blob/main/docs/issues-schema.md
# Methodology: https://github.com/pirlruc/methodologies/tree/1.1.0/github-issue-adr

milestones:
  - name: Phase 1 — Image lifecycle
    epics:
      - id: CDO-001
        status: done
        title: Repository foundation (submodules, templates, local parity)
        overview:
          problem: No org reusable workflows for production OCI images.
          goal: Standalone containerdevops with pinned guardrails/scaffold and local parity script.
        architecture:
          target: repository root
          modules:
            - scripts/check-container-local.sh
            - templates/
            - docs/guardrails
        acceptance_criteria:
          - Submodules pinned; sync-container-tooling seeds consumers
          - check-container-local.sh documents host-vs-Docker resolution
        guardrail_refs:
          - DOCKER-BUILD-003
          - CI-008
        tasks:
          - id: CDO-001-T1
            status: done
            title: Author README scripts templates and handoff
            instructions:
              files:
                - README.md
                - scripts/
                - templates/
            verification:
              - test -f scripts/check-container-local.sh
            guardrail_refs:
              - CI-008

      - id: CDO-002
        status: done
        title: Lint and build reusable workflows
        overview:
          problem: Consumers need hadolint, structure-test, size and efficiency gates.
          goal: container-lint.yml and container-build.yml with ADVISORY/blocking contract.
        architecture:
          target: .github/workflows/container-lint.yml and container-build.yml
          modules:
            - .github/workflows/container-lint.yml
            - .github/workflows/container-build.yml
        acceptance_criteria:
          - Thresholds read from docker/profile.thresholds.yml
          - Image tarball uploaded as artifact
        guardrail_refs:
          - DOCKER-LINT-001
          - DOCKER-TEST-001
          - DOCKER-PERF-001
        tasks:
          - id: CDO-002-T1
            status: done
            title: Implement container-lint and container-build
            instructions:
              files:
                - .github/workflows/container-lint.yml
                - .github/workflows/container-build.yml
            verification:
              - actionlint .github/workflows/container-lint.yml
            guardrail_refs:
              - DOCKER-LINT-001

      - id: CDO-003
        status: done
        title: Image scan workflow (Trivy Syft Grype)
        overview:
          problem: cpp-security only scans source trees; images need dedicated scan.
          goal: container-scan.yml against built images with SARIF upload.
        architecture:
          target: .github/workflows/container-scan.yml
          modules:
            - .github/workflows/container-scan.yml
        acceptance_criteria:
          - Scans image artifact or registry ref
          - Fail-on severity from profile.thresholds.yml
        guardrail_refs:
          - DOCKER-SEC-001
          - DOCKER-SEC-002
        tasks:
          - id: CDO-003-T1
            status: done
            title: Implement container-scan
            instructions:
              files:
                - .github/workflows/container-scan.yml
            verification:
              - actionlint .github/workflows/container-scan.yml
            guardrail_refs:
              - DOCKER-SEC-001

      - id: CDO-004
        status: done
        title: Multi-registry publish with gated signing
        overview:
          problem: Need GHCR + Docker Hub same-digest publish; signing blocked on private Free plan.
          goal: container-publish.yml with sign input defaulting off for private repos.
        architecture:
          target: .github/workflows/container-publish.yml
          modules:
            - .github/workflows/container-publish.yml
        acceptance_criteria:
          - Dual images via metadata-action
          - Cosign and attest steps gated on sign
        guardrail_refs:
          - DOCKER-DELIV-001
          - DOCKER-SEC-003
          - DOCKER-SEC-004
        tasks:
          - id: CDO-004-T1
            status: done
            title: Implement container-publish
            instructions:
              files:
                - .github/workflows/container-publish.yml
            verification:
              - actionlint .github/workflows/container-publish.yml
            guardrail_refs:
              - DOCKER-DELIV-001

      - id: CDO-005
        status: done
        title: IaC and Compose validation workflow
        overview:
          problem: home-assistant and others duplicate KICS and compose config jobs.
          goal: container-iac.yml reusable for KICS + compose config.
        architecture:
          target: .github/workflows/container-iac.yml
          modules:
            - .github/workflows/container-iac.yml
        acceptance_criteria:
          - Digest-pinned KICS image
          - iac_fail_on from thresholds
        guardrail_refs:
          - DOCKER-LINT-002
          - DOCKER-LINT-003
        tasks:
          - id: CDO-005-T1
            status: done
            title: Implement container-iac
            instructions:
              files:
                - .github/workflows/container-iac.yml
            verification:
              - actionlint .github/workflows/container-iac.yml
            guardrail_refs:
              - DOCKER-LINT-002

  - name: Phase 2 — Devcontainer
    epics:
      - id: CDO-006
        status: done
        title: Devcontainer lint and build verification
        overview:
          problem: cpp-infra hadolints Dockerfiles but there is no shared devcontainer gate.
          goal: Reusable workflow verifying .devcontainer Dockerfiles and builds.
        architecture:
          target: future container-devcontainer.yml
          modules:
            - .github/workflows/
        acceptance_criteria:
          - Absorbs hadolint step currently in cpp-infra.yml
          - Optional build of devcontainer image in CI
        guardrail_refs:
          - DOCKER-LINT-001
          - DOCKER-BUILD-003
        tasks:
          - id: CDO-006-T1
            status: done
            title: Design and implement container-devcontainer workflow
            instructions:
              files:
                - .github/workflows/container-devcontainer.yml
            verification:
              - actionlint .github/workflows/container-devcontainer.yml
            guardrail_refs:
              - DOCKER-LINT-001

  - name: Continuous improvement
    epics:
      - id: CDO-007
        status: done
        title: Least-privilege permissions on reusable container workflows
        overview:
          problem: 'container-lint.yml and container-build.yml declare no permissions: block, so
            they inherit the caller''s default token while building PR-supplied Dockerfiles. Publish/scan
            set some scopes; lint/build do not.'
          goal: 'Explicit least-privilege permissions: on all five reusable workflows (contents:
            read minimum; add security-events / packages / id-token only where required).'
        architecture:
          target: .github/workflows/
          modules:
          - .github/workflows/container-lint.yml
          - .github/workflows/container-build.yml
          - .github/workflows/container-scan.yml
          - .github/workflows/container-publish.yml
          - .github/workflows/container-iac.yml
        acceptance_criteria:
        - Every reusable workflow has a top-level or job-level permissions block
        - Lint and build use contents: read (and no write scopes)
        - actionlint passes
        guardrail_refs:
        - CI-001
        - DOCKER-DELIV-002
        tasks:
        - id: CDO-007-T1
          status: open
          title: Add explicit permissions to lint and build workflows
          instructions:
            files:
            - .github/workflows/container-lint.yml
            - .github/workflows/container-build.yml
          verification:
          - actionlint .github/workflows/container-lint.yml .github/workflows/container-build.yml
          guardrail_refs:
          - CI-001
      - id: CDO-008
        status: open
        title: Adopt and verify multi-ecosystem Dependabot (SC-DEP-*)
        overview:
          problem: >-
            Dependency updates may still use per-ecosystem schedules, missing
            ecosystems, or shapes that do not produce one monthly multi-ecosystem
            PR. SC-DEP-001/002/003 require covering every package ecosystem, a
            single grouped PR, and the org cadence/semver policy.
          goal: >-
            Align .github/dependabot.yml with the org multi-ecosystem monthly
            shape (seed from github-scaffold templates/dependabot.example.yml when
            needed); confirm Insights grouping after the config is on the default
            branch; document any justified deviations.
        architecture:
          target: .github/dependabot.yml
          modules:
            - .github/dependabot.yml
            - docs/ai-agent-handoff.md
        acceptance_criteria:
          - dependabot.yml uses a monthly multi-ecosystem group covering this repo's ecosystems
          - open-pull-requests-limit and semver policy match SC-DEP-003 / supply-chain thresholds
          - Insights confirmation recorded in handoff after merge to default branch (or GitHub limitation noted)
        guardrail_refs:
          - SC-DEP-001
          - SC-DEP-002
          - SC-DEP-003
        tasks:
          - id: CDO-008-T1
            status: open
            title: Rewrite or confirm Dependabot multi-ecosystem config
            instructions:
              files:
                - .github/dependabot.yml
            verification:
              - rg -n "multi-ecosystem|schedule|package-ecosystem" .github/dependabot.yml
            guardrail_refs:
              - SC-DEP-001
              - SC-DEP-002
          - id: CDO-008-T2
            status: open
            title: Record Insights confirmation in handoff after default-branch land
            instructions:
              files:
                - docs/ai-agent-handoff.md
            verification:
              - Handoff notes Insights one-PR grouping outcome or documents blocker
            guardrail_refs:
              - SC-DEP-003
      - id: CDO-009
        status: open
        title: Review for improvements, bugs, and design flaws
        overview:
          problem: >-
            Backlog and automation can drift toward process or docs hygiene only.
            The repo needs a deliberate review of the current implementation that
            surfaces improvements, bugs, and design flaws — not only polish — and
            records material follow-ups in docs/issues.yml.
          goal: >-
            Run an ai-reviewer (or equivalent) pass against this repository's
            current code, workflows, scripts, and docs; append only material new
            epics/tasks under Continuous improvement (or record a justified no-op).
        architecture:
          target: Repository review into docs/issues.yml
          modules:
            - docs/issues.yml
            - docs/ai-agent-handoff.md
        acceptance_criteria:
          - Review explicitly covers improvements, bugs, and design flaws in shipped implementation
          - Material findings appended to docs/issues.yml via PR (budget at most 2 epics / 6 tasks) or handoff records justified no-op
          - Does not re-file work already covered by existing epic/task ids
        tasks:
          - id: CDO-009-T1
            status: open
            title: Run review pass and append material issues.yml findings
            instructions:
              files:
                - docs/issues.yml
                - docs/ai-agent-handoff.md
            verification:
              - PR appends material findings within budget, or handoff records justified no-op
