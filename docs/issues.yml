# Authored backlog for containerdevops.
#
# Schema: https://github.com/pirlruc/github-scaffold/blob/main/docs/issues-schema.md
# Methodology: https://github.com/pirlruc/methodologies/tree/1.8.0/github-issue-adr

milestones:
  - name: Phase 1 — Image lifecycle
    epics:
      - id: CDO-001
        status: done
        title: Repository foundation (submodules, templates, local parity)
        overview:
          problem: No org reusable workflows for production OCI images.
          goal: Standalone containerdevops with pinned guardrails/scaffold and local parity script.
        architecture:
          target: repository root
          modules:
            - scripts/check-container-local.sh
            - templates/
            - docs/guardrails
        acceptance_criteria:
          - Submodules pinned; sync-container-tooling seeds consumers
          - check-container-local.sh documents host-vs-Docker resolution
        guardrail_refs:
          - DOCKER-BUILD-003
          - CI-008
        tasks:
          - id: CDO-001-T1
            status: done
            title: Author README scripts templates and handoff
            instructions:
              files:
                - README.md
                - scripts/
                - templates/
            verification:
              - test -f scripts/check-container-local.sh
            guardrail_refs:
              - CI-008

      - id: CDO-002
        status: done
        title: Lint and build reusable workflows
        overview:
          problem: Consumers need hadolint, structure-test, size and efficiency gates.
          goal: container-lint.yml and container-build.yml with ADVISORY/blocking contract.
        architecture:
          target: .github/workflows/container-lint.yml and container-build.yml
          modules:
            - .github/workflows/container-lint.yml
            - .github/workflows/container-build.yml
        acceptance_criteria:
          - Thresholds read from docker/profile.thresholds.yml
          - Image tarball uploaded as artifact
        guardrail_refs:
          - DOCKER-LINT-001
          - DOCKER-TEST-001
          - DOCKER-PERF-001
        tasks:
          - id: CDO-002-T1
            status: done
            title: Implement container-lint and container-build
            instructions:
              files:
                - .github/workflows/container-lint.yml
                - .github/workflows/container-build.yml
            verification:
              - actionlint .github/workflows/container-lint.yml
            guardrail_refs:
              - DOCKER-LINT-001

      - id: CDO-003
        status: done
        title: Image scan workflow (Trivy Syft Grype)
        overview:
          problem: cpp-security only scans source trees; images need dedicated scan.
          goal: container-scan.yml against built images with SARIF upload.
        architecture:
          target: .github/workflows/container-scan.yml
          modules:
            - .github/workflows/container-scan.yml
        acceptance_criteria:
          - Scans image artifact or registry ref
          - Fail-on severity from profile.thresholds.yml
        guardrail_refs:
          - DOCKER-SEC-001
          - DOCKER-SEC-002
        tasks:
          - id: CDO-003-T1
            status: done
            title: Implement container-scan
            instructions:
              files:
                - .github/workflows/container-scan.yml
            verification:
              - actionlint .github/workflows/container-scan.yml
            guardrail_refs:
              - DOCKER-SEC-001

      - id: CDO-004
        status: done
        title: Multi-registry publish with gated signing
        overview:
          problem: Need GHCR + Docker Hub same-digest publish; signing blocked on private Free plan.
          goal: container-publish.yml with sign input defaulting off for private repos.
        architecture:
          target: .github/workflows/container-publish.yml
          modules:
            - .github/workflows/container-publish.yml
        acceptance_criteria:
          - Dual images via metadata-action
          - Cosign and attest steps gated on sign
        guardrail_refs:
          - DOCKER-DELIV-001
          - DOCKER-SEC-003
          - DOCKER-SEC-004
        tasks:
          - id: CDO-004-T1
            status: done
            title: Implement container-publish
            instructions:
              files:
                - .github/workflows/container-publish.yml
            verification:
              - actionlint .github/workflows/container-publish.yml
            guardrail_refs:
              - DOCKER-DELIV-001

      - id: CDO-005
        status: done
        title: IaC and Compose validation workflow
        overview:
          problem: home-assistant and others duplicate KICS and compose config jobs.
          goal: container-iac.yml reusable for KICS + compose config.
        architecture:
          target: .github/workflows/container-iac.yml
          modules:
            - .github/workflows/container-iac.yml
        acceptance_criteria:
          - Digest-pinned KICS image
          - iac_fail_on from thresholds
        guardrail_refs:
          - DOCKER-LINT-002
          - DOCKER-LINT-003
        tasks:
          - id: CDO-005-T1
            status: done
            title: Implement container-iac
            instructions:
              files:
                - .github/workflows/container-iac.yml
            verification:
              - actionlint .github/workflows/container-iac.yml
            guardrail_refs:
              - DOCKER-LINT-002

  - name: Phase 2 — Devcontainer
    epics:
      - id: CDO-006
        status: done
        title: Devcontainer lint and build verification
        overview:
          problem: cpp-infra hadolints Dockerfiles but there is no shared devcontainer gate.
          goal: Reusable workflow verifying .devcontainer Dockerfiles and builds.
        architecture:
          target: future container-devcontainer.yml
          modules:
            - .github/workflows/
        acceptance_criteria:
          - Absorbs hadolint step currently in cpp-infra.yml
          - Optional build of devcontainer image in CI
        guardrail_refs:
          - DOCKER-LINT-001
          - DOCKER-BUILD-003
        tasks:
          - id: CDO-006-T1
            status: done
            title: Design and implement container-devcontainer workflow
            instructions:
              files:
                - .github/workflows/container-devcontainer.yml
            verification:
              - actionlint .github/workflows/container-devcontainer.yml
            guardrail_refs:
              - DOCKER-LINT-001

  - name: Continuous improvement
    epics:
      - id: CDO-007
        status: done
        title: Least-privilege permissions on reusable container workflows
        overview:
          problem: 'container-lint.yml and container-build.yml declare no permissions: block, so
            they inherit the caller''s default token while building PR-supplied Dockerfiles. Publish/scan
            set some scopes; lint/build do not.'
          goal: 'Explicit least-privilege permissions: on all five reusable workflows (contents:
            read minimum; add security-events / packages / id-token only where required).'
        architecture:
          target: .github/workflows/
          modules:
          - .github/workflows/container-lint.yml
          - .github/workflows/container-build.yml
          - .github/workflows/container-scan.yml
          - .github/workflows/container-publish.yml
          - .github/workflows/container-iac.yml
        acceptance_criteria:
        - Every reusable workflow has a top-level or job-level permissions block
        - Lint and build use contents: read (and no write scopes)
        - actionlint passes
        guardrail_refs:
        - CI-001
        - DOCKER-DELIV-002
        tasks:
        - id: CDO-007-T1
          status: done
          title: Add explicit permissions to lint and build workflows
          instructions:
            files:
            - .github/workflows/container-lint.yml
            - .github/workflows/container-build.yml
          verification:
          - actionlint .github/workflows/container-lint.yml .github/workflows/container-build.yml
          guardrail_refs:
          - CI-001
      - id: CDO-008
        status: done
        title: Adopt and verify multi-ecosystem Dependabot (SC-DEP-*)
        overview:
          problem: >-
            Dependency updates may still use per-ecosystem schedules, missing
            ecosystems, or shapes that do not produce one monthly multi-ecosystem
            PR. SC-DEP-001/002/003 require covering every package ecosystem, a
            single grouped PR, and the org cadence/semver policy.
          goal: >-
            Align .github/dependabot.yml with the org multi-ecosystem monthly
            shape (seed from github-scaffold templates/dependabot.example.yml when
            needed); confirm Insights grouping after the config is on the default
            branch; document any justified deviations.
        architecture:
          target: .github/dependabot.yml
          modules:
            - .github/dependabot.yml
            - docs/ai-agent-handoff.md
        acceptance_criteria:
          - dependabot.yml uses a monthly multi-ecosystem group covering this repo's ecosystems
          - open-pull-requests-limit and semver policy match SC-DEP-003 / supply-chain thresholds
          - Insights confirmation recorded in handoff after merge to default branch (or GitHub limitation noted)
        guardrail_refs:
          - SC-DEP-001
          - SC-DEP-002
          - SC-DEP-003
        tasks:
          - id: CDO-008-T1
            status: done
            title: Rewrite or confirm Dependabot multi-ecosystem config
            instructions:
              files:
                - .github/dependabot.yml
            verification:
              - rg -n "multi-ecosystem|schedule|package-ecosystem" .github/dependabot.yml
            guardrail_refs:
              - SC-DEP-001
              - SC-DEP-002
          - id: CDO-008-T2
            status: done
            title: Record Insights confirmation in handoff after default-branch land
            instructions:
              files:
                - docs/ai-agent-handoff.md
            verification:
              - Handoff notes Insights one-PR grouping outcome or documents blocker
            guardrail_refs:
              - SC-DEP-003
      - id: CDO-009
        status: done
        title: Review for improvements, bugs, and design flaws
        overview:
          problem: >-
            Backlog and automation can drift toward process or docs hygiene only.
            The repo needs a deliberate review of the current implementation that
            surfaces improvements, bugs, and design flaws — not only polish — and
            records material follow-ups in docs/issues.yml.
          goal: >-
            Run an ai-reviewer (or equivalent) pass against this repository's
            current code, workflows, scripts, and docs; append only material new
            epics/tasks under Continuous improvement (or record a justified no-op).
        architecture:
          target: Repository review into docs/issues.yml
          modules:
            - docs/issues.yml
            - docs/ai-agent-handoff.md
        acceptance_criteria:
          - Review explicitly covers improvements, bugs, and design flaws in shipped implementation
          - Material findings appended to docs/issues.yml via PR (budget at most 2 epics / 6 tasks) or handoff records justified no-op
          - Does not re-file work already covered by existing epic/task ids
        tasks:
          - id: CDO-009-T1
            status: done
            title: Run review pass and append material issues.yml findings
            instructions:
              files:
                - docs/issues.yml
                - docs/ai-agent-handoff.md
            verification:
              - PR appends material findings within budget, or handoff records justified no-op

      - id: CDO-010
        status: done
        title: runner_image bootstrap for container-lint and devcontainer
        overview:
          problem: Job container on ci-container creates a publish bootstrap cycle with ci-base.
          goal: Dual-job runner_image input; empty string runs on bare runner with tool install.
        architecture:
          target: container-lint.yml + container-devcontainer.yml
          modules:
            - .github/workflows/container-lint.yml
            - .github/workflows/container-devcontainer.yml
        acceptance_criteria:
          - Empty runner_image uses host install path; non-empty uses job container
          - ci-base caller can pass runner_image empty permanently
        guardrail_refs:
          - CI-028
        tasks:
          - id: CDO-010-T1
            status: done
            title: Add runner_image dual jobs and host install path
            instructions:
              files:
                - .github/workflows/container-lint.yml
                - .github/workflows/container-devcontainer.yml
                - scripts/install-container-tools.sh
            verification:
              - actionlint .github/workflows/container-lint.yml
            guardrail_refs:
              - CI-028

      - id: CDO-011
        status: done
        title: Base-image age gate (DOCKER-BUILD-006)
        overview:
          problem: No automated base-image age check; deviation recorded under CDO-009.
          goal: check-base-image-age.sh in container-build; remove deviation.
        architecture:
          target: scripts/check-base-image-age.sh + container-build.yml
          modules:
            - scripts/check-base-image-age.sh
            - .github/workflows/container-build.yml
            - docs/guardrail-deviations.yml
        acceptance_criteria:
          - Gate reads base_image_max_age_days from vendored thresholds
          - deviations.yml empty for DOCKER-BUILD-006
        guardrail_refs:
          - DOCKER-BUILD-006
        tasks:
          - id: CDO-011-T1
            status: done
            title: Implement age gate and clear deviation
            instructions:
              files:
                - scripts/check-base-image-age.sh
                - .github/workflows/container-build.yml
                - docs/guardrail-deviations.yml
            verification:
              - test -x scripts/check-base-image-age.sh
            guardrail_refs:
              - DOCKER-BUILD-006

      - id: CDO-012
        status: done
        title: Per-platform publish verification (DOCKER-TEST-002)
        overview:
          problem: Multi-arch publish did not verify each platform.
          goal: verify-multiarch.sh after push; remove deviation.
        architecture:
          target: scripts/verify-multiarch.sh + container-publish.yml
          modules:
            - scripts/verify-multiarch.sh
            - .github/workflows/container-publish.yml
            - docs/guardrail-deviations.yml
        acceptance_criteria:
          - Manifest list asserts every requested platform
          - Per-platform smoke run; optional CST
          - deviations.yml empty for DOCKER-TEST-002
        guardrail_refs:
          - DOCKER-TEST-002
        tasks:
          - id: CDO-012-T1
            status: done
            title: Implement verify-multiarch and wire tag_latest
            instructions:
              files:
                - scripts/verify-multiarch.sh
                - .github/workflows/container-publish.yml
            verification:
              - test -x scripts/verify-multiarch.sh
            guardrail_refs:
              - DOCKER-TEST-002

      - id: CDO-013
        status: done
        title: ci-container publish caller and CI-026 digest pins
        overview:
          problem: ci-container unpublished; dive COPY --from was tag-only.
          goal: ci-container-image.yml on release/schedule; digest-pin dive.
        architecture:
          target: docker/ci-container + ci-container-image.yml
          modules:
            - docker/ci-container/Dockerfile
            - .github/workflows/ci-container-image.yml
        acceptance_criteria:
          - Publish on release published + monthly schedule + dispatch
          - dive COPY --from digest-pinned
        guardrail_refs:
          - CI-026
          - CI-027
        tasks:
          - id: CDO-013-T1
            status: done
            title: Author ci-container-image.yml and pin dive digest
            instructions:
              files:
                - .github/workflows/ci-container-image.yml
                - docker/ci-container/Dockerfile
            verification:
              - actionlint .github/workflows/ci-container-image.yml
            guardrail_refs:
              - CI-026

      - id: CDO-014
        status: done
        title: Self-CI and scheduled security callers
        overview:
          problem: No dogfood self-CI; reusable workflows only fired via workflow_dispatch noise.
          goal: containerdevops-ci on push/PR/dispatch; weekly security schedule.
        architecture:
          target: containerdevops-ci.yml + containerdevops-security.yml
          modules:
            - .github/workflows/containerdevops-ci.yml
            - .github/workflows/containerdevops-security.yml
        acceptance_criteria:
          - Push/PR main + concurrency on self-CI
          - Weekly secrets/SAST, supply-chain, KICS, published-image rescan
        guardrail_refs:
          - CI-002
          - CI-024
        tasks:
          - id: CDO-014-T1
            status: done
            title: Add containerdevops-ci and containerdevops-security workflows
            instructions:
              files:
                - .github/workflows/containerdevops-ci.yml
                - .github/workflows/containerdevops-security.yml
            verification:
              - actionlint .github/workflows/containerdevops-ci.yml
            guardrail_refs:
              - CI-002

      - id: CDO-015
        status: done
        title: Time-boxed Trivy ignores for vendor-static ci-container donors
        overview:
          problem: >
            ci-container inherits ci-base donor HIGH findings and adds dive /
            container-structure-test CVEs that block publish under DOCKER-SEC-001.
          goal: >
            Path-scoped .trivyignore.yaml (review 2026-11-11) after bumping dive
            and structure-test digests to the newest available.
        architecture:
          target: docker/ci-container + repo ignorefile
          modules:
            - .trivyignore.yaml
            - docker/ci-container/Dockerfile
        acceptance_criteria:
          - dive v0.13.1 and structure-test 1.22.1 digest-pinned
          - .trivyignore.yaml covers remaining donor HIGH/CRITICAL with path + statement
          - Trivy library scan exits 0 with ignorefile on a local ci-container build
        guardrail_refs:
          - DOCKER-SEC-001
          - CI-026
        tasks:
          - id: CDO-015-T1
            status: done
            title: Bump donors and add path-scoped .trivyignore.yaml
            instructions:
              files:
                - .trivyignore.yaml
                - docker/ci-container/Dockerfile
            verification:
              - test -f .trivyignore.yaml
              - grep -q 'dive:v0.13.1' docker/ci-container/Dockerfile
            guardrail_refs:
              - DOCKER-SEC-001

      - id: CDO-016
        status: done
        title: Consumer-facing package metadata and registry pages
        overview:
          problem: >-
            docker/metadata-action defaults overwrote OCI title/description with the
            repository description, so published ci-container images advertised the
            wrong thing on GHCR and Hub. Hub Overview was empty; GHCR and Hub consumer
            docs were mixed in one file.
          goal: >-
            Optional image_* and dockerhub_* inputs on container-publish/build that
            override metadata-action defaults; automatic Hub Overview sync; separate
            docker-hub.md and github-packages.md with consumer-only content.
        architecture:
          target: container-publish.yml + registry docs
          modules:
            - .github/workflows/container-publish.yml
            - .github/workflows/container-build.yml
            - .github/workflows/ci-container-image.yml
            - docker/ci-container/Dockerfile
            - docs/docker-hub.md
            - docs/github-packages.md
        acceptance_criteria:
          - Publish labels carry image-specific title/description (not repo description)
          - Hub Overview synced from docs/docker-hub.md on publish
          - github-packages.md covers GHCR auth, pull, and Actions container use
        guardrail_refs:
          - DOCKER-DOC-001
          - DOCKER-DOC-002
        tasks:
          - id: CDO-016-T1
            status: done
            title: Wire image metadata overrides and Hub Overview sync
            instructions:
              files:
                - .github/workflows/container-publish.yml
                - .github/workflows/container-build.yml
                - .github/workflows/ci-container-image.yml
                - docker/ci-container/Dockerfile
            verification:
              - rg -n "image_description|dockerhub_readme|DOCKER_METADATA_ANNOTATIONS_LEVELS" .github/workflows/container-publish.yml
            guardrail_refs:
              - DOCKER-DOC-001
          - id: CDO-016-T2
            status: done
            title: Split Hub and GitHub Packages consumer docs
            instructions:
              files:
                - docs/docker-hub.md
                - docs/github-packages.md
                - README.md
                - docs/workflows.md
            verification:
              - test -f docs/docker-hub.md
              - test -f docs/github-packages.md
            guardrail_refs:
              - DOCKER-DOC-002

      - id: CDO-WF-001
        status: done
        title: Workflow contract and documentation drift
        overview:
          problem: >-
            docs/workflows.md describes the size gate as docker image inspect .Size while
            scripts/check-image-size.sh measures via du -sxm /. Input tables omit
            container-devcontainer.yml entirely and miss ignorefile / blocking / scripts_ref
            on container-scan and several container-lint flags. container-build.yml runs
            dive with || true which masks non-efficiency failures. Nested commondevops
            pins still point at tag 1.0.0 while latest is 2.0.2.
          goal: >-
            Align workflows.md with the scripts and inputs that actually ship; make dive
            failures advisory-only rather than always-ignored; bump commondevops uses: and
            scripts_ref in lockstep to 2.0.2.
        architecture:
          target: docs/workflows.md + container-build.yml + commondevops pins
          modules:
            - docs/workflows.md
            - .github/workflows/container-build.yml
            - .github/workflows/container-lint.yml
            - .github/workflows/containerdevops-security.yml
        acceptance_criteria:
          - docs/workflows.md size-gate paragraph describes du -sxm /
          - docs/workflows.md documents container-devcontainer.yml and scan ignorefile/blocking/scripts_ref
          - dive step does not use || true; non-zero exit fails unless ADVISORY
          - All commondevops uses:/scripts_ref pairs pin 2.0.2 SHA
        guardrail_refs:
          - CI-001
        tasks:
          - id: CDO-WF-001-T1
            status: done
            title: Fix size-gate description in docs/workflows.md
            instructions:
              files:
                - docs/workflows.md
            verification:
              - grep -q "du -sxm" docs/workflows.md
              - "! grep -q \"docker image inspect --format '{{.Size}}'\" docs/workflows.md"
          - id: CDO-WF-001-T2
            status: done
            title: Sync workflows.md input tables with live workflow inputs
            instructions:
              files:
                - docs/workflows.md
                - .github/workflows/container-lint.yml
                - .github/workflows/container-scan.yml
                - .github/workflows/container-devcontainer.yml
            verification:
              - grep -q "container-devcontainer.yml" docs/workflows.md
              - grep -q "ignorefile" docs/workflows.md
          - id: CDO-WF-001-T3
            status: done
            title: Stop masking dive non-efficiency failures in container-build.yml
            instructions:
              files:
                - .github/workflows/container-build.yml
            verification:
              - "! grep -q 'dive .*|| true' .github/workflows/container-build.yml"
              - actionlint .github/workflows/container-build.yml
          - id: CDO-WF-001-T4
            status: done
            title: Bump commondevops pin to 2.0.2 in lockstep
            instructions:
              files:
                - .github/workflows/container-lint.yml
                - .github/workflows/containerdevops-security.yml
            verification:
              - "! grep -q a504555c4731ee886d2a48c4ec20d110ad9434f8 .github/workflows/*.yml"
              - grep -q 4fd83922506d6d5191d593ff9768516e34211084 .github/workflows/container-lint.yml
            guardrail_refs:
              - CI-001

      - id: CDO-SC-001
        status: done
        title: "install-container-tools.sh: actionlint tarball and checksum verification"
        overview:
          problem: >-
            scripts/install-container-tools.sh installs actionlint by piping
            download-actionlint.bash from the main branch into bash. Every other tool
            uses a versioned tarball. None of the nine downloads verify SHA256 digests,
            and version constants lack upstream release URL annotations for manual bumps
            (outside Dependabot coverage).
          goal: >-
            Install actionlint from a versioned release tarball; verify SHA256 for every
            downloaded artifact; annotate each version constant with its releases URL;
            document the manual-update process in the handoff.
        architecture:
          target: scripts/install-container-tools.sh + docs/ai-agent-handoff.md
          modules:
            - scripts/install-container-tools.sh
            - docs/ai-agent-handoff.md
        acceptance_criteria:
          - actionlint installs via a versioned tarball (no curl|bash from main)
          - Every download verifies SHA256 against a pinned digest
          - Each version constant has an inline release URL comment
          - shellcheck passes on install-container-tools.sh
          - docs/ai-agent-handoff.md notes script tool-versions require manual bumps
        guardrail_refs:
          - CI-026
          - SC-DEP-001
        tasks:
          - id: CDO-SC-001-T1
            status: done
            title: Replace actionlint unsigned pipe with versioned tarball install
            instructions:
              files:
                - scripts/install-container-tools.sh
            verification:
              - "! grep -q download-actionlint.bash scripts/install-container-tools.sh"
              - grep -q "actionlint_.*_linux_amd64.tar.gz" scripts/install-container-tools.sh
              - shellcheck scripts/install-container-tools.sh
            guardrail_refs:
              - CI-026
          - id: CDO-SC-001-T2
            status: done
            title: Add SHA256 verification for all downloaded tool artifacts
            instructions:
              files:
                - scripts/install-container-tools.sh
            verification:
              - grep -q "sha256sum" scripts/install-container-tools.sh
              - shellcheck scripts/install-container-tools.sh
          - id: CDO-SC-001-T3
            status: done
            title: Annotate version constants and document manual bumps in handoff
            instructions:
              files:
                - scripts/install-container-tools.sh
                - docs/ai-agent-handoff.md
            verification:
              - grep -q "github.com/.*/releases" scripts/install-container-tools.sh
              - grep -qi "install-container-tools\|TRIVY_VERSION\|tool.version" docs/ai-agent-handoff.md
            guardrail_refs:
              - SC-DEP-001

      - id: CDO-SEC-001
        status: done
        title: Harden reusable-workflow inputs for ignorefile and verify_command
        overview:
          problem: >-
            container-scan.yml falls back to the caller root .trivyignore.yaml when
            ignorefile is empty, so advisory posture scans that intentionally omit an
            ignorefile are silently filtered. check-container-local.sh duplicates that
            fallback. verify-multiarch.sh runs verify_command via bash -lc, creating a
            template-injection surface for the verify_command workflow input.
          goal: >-
