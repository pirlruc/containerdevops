# Single-repo bootstrap for containerdevops labels and milestones.
targets:
  - repo: pirlruc/containerdevops
    yaml: docs/issues.yml

labels:
  - { name: epic, color: "5319E7", description: "Decision record" }
  - { name: task, color: "0E8A16", description: "Unit of work under an epic" }
  - { name: ai-architect, color: "7057FF", description: "Architecture or planning" }
  - { name: ai-implementer, color: "1D76DB", description: "Implementation" }
  - { name: ai-reviewer, color: "ededed", description: "Review or triage" }

milestones:
  - name: Phase 1 — Image lifecycle
    description: Production OCI lint, build, scan, publish, and IaC reusable workflows
  - name: Phase 2 — Devcontainer
    description: Shared devcontainer lint and build verification (deferred)
  - name: Continuous improvement
    description: Ongoing reviewer-filed improvements, bugs, and design flaws
