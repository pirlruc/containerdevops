# GHCR-only publish caller (CDO-CALL-001).
# Replace PLACEHOLDER_SHA with the same commit in uses: and scripts_ref.
#
# github.token is enough for GHCR when this job grants packages: write.
# Do not pass a read-only PAT as the push credential. Omit DOCKERHUB_*
# unless the image also goes to Docker Hub. A private base that github.token
# cannot pull needs ghcr_token (packages: read on that package).
name: Publish container

on:
  workflow_dispatch: {}

permissions: {}

jobs:
  publish:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: pirlruc/containerdevops/.github/workflows/container-publish.yml@PLACEHOLDER_SHA
    with:
      context: .
      dockerfile: Dockerfile
      image_name: my-image
      scripts_ref: PLACEHOLDER_SHA
      platforms: linux/amd64
      sign: ${{ github.event.repository.visibility == 'public' }}
    secrets:
      scripts_token: ${{ secrets.CONTAINERDEVOPS_READ_TOKEN }}
