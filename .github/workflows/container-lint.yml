name: Container Lint (reusable)

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Path to Dockerfile
        required: false
        type: string
        default: Dockerfile
      working_directory:
        description: Repo subdirectory containing the Dockerfile
        required: false
        type: string
        default: .
      blocking:
        description: When false, failures are advisory only
        required: false
        type: boolean
        default: false
      shell_scripts:
        description: Glob or space-separated entrypoint scripts to shellcheck
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      dockerfile:
        type: string
        default: Dockerfile
      working_directory:
        type: string
        default: .
      blocking:
        type: boolean
        default: false
      shell_scripts:
        type: string
        default: ""

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout containerdevops scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pirlruc/containerdevops
          path: _containerdevops
          sparse-checkout: |
            scripts
            docs/guardrails/docker
          sparse-checkout-cone-mode: false

      - name: Install tooling
        working-directory: ${{ github.workspace }}
        run: bash _containerdevops/scripts/install-container-tools.sh

      - name: Resolve hadolint threshold
        id: thr
        working-directory: ${{ github.workspace }}
        run: |
          FILE="_containerdevops/docs/guardrails/docker/profile.thresholds.yml"
          if [[ ! -f "$FILE" ]]; then
            FILE="docs/guardrails/docker/profile.thresholds.yml"
          fi
          echo "hadolint=$(bash _containerdevops/scripts/read-thresholds.sh hadolint_failure_threshold "$FILE")" >> "$GITHUB_OUTPUT"

      - name: hadolint
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          hadolint --failure-threshold "${{ steps.thr.outputs.hadolint }}" \
            "${{ inputs.dockerfile }}"

      - name: shellcheck entrypoints
        if: inputs.shell_scripts != ''
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # shellcheck disable=SC2086
          shellcheck ${{ inputs.shell_scripts }}

      - name: actionlint
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        working-directory: ${{ github.workspace }}
        run: |
          mapfile -t WFS < <(find .github/workflows -name '*.yml' -o -name '*.yaml' 2>/dev/null | head -40)
          if [[ ${#WFS[@]} -eq 0 ]]; then
            echo "No workflows to lint"
            exit 0
          fi
          actionlint "${WFS[@]}"
