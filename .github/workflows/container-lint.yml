name: Container Lint (reusable)

# Hadolint with docker profile thresholds (host install or docker run of runner_image).
# actionlint / shellcheck / zizmor → commondevops common-infra-lint.
# Secrets (DOCKER-SEC-005) → commondevops common-secrets-sast.
# commondevops pin: keep uses: and scripts_ref in lockstep (update after commondevops release).
#
# runner_image: empty → install tools on the bare runner (bootstrap / ci-base caller).
# Non-empty → docker run that image for hadolint/shellcheck (avoids job-level container:
# which fails workflow validation when the expression can be empty).

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Path to Dockerfile
        required: false
        type: string
        default: Dockerfile
      working_directory:
        description: Repo subdirectory containing the Dockerfile
        required: false
        type: string
        default: .
      blocking:
        description: When false, failures are advisory only
        required: false
        type: boolean
        default: false
      shell_scripts:
        description: Glob or space-separated entrypoint scripts to shellcheck
        required: false
        type: string
        default: ""
      scripts_ref:
        description: "Commit/tag/branch of this repo to checkout for scripts (must match uses: pin)"
        required: false
        type: string
        default: ""
      runner_image:
        description: "Optional image for docker-run hadolint; empty installs on the host"
        required: false
        type: string
        default: ""
      run_infra_lint:
        description: Call common-infra-lint (actionlint/shellcheck/zizmor/hadolint)
        required: false
        type: boolean
        default: true
      run_secrets_scan:
        description: Call common-secrets-sast (DOCKER-SEC-005)
        required: false
        type: boolean
        default: true
    secrets:
      checkout_token:
        required: false
  workflow_dispatch:
    inputs:
      dockerfile:
        type: string
        default: Dockerfile
      working_directory:
        type: string
        default: .
      blocking:
        type: boolean
        default: false
      shell_scripts:
        type: string
        default: ""
      scripts_ref:
        type: string
        default: ""
      runner_image:
        type: string
        default: ""

# CI-025
permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout containerdevops scripts
        if: github.actor != 'dependabot[bot]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/containerdevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _containerdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Install tooling (host path)
        if: inputs.runner_image == ''
        working-directory: ${{ github.workspace }}
        env:
          INSTALL_ONLY: hadolint,shellcheck
        run: bash _containerdevops/scripts/install-container-tools.sh

      - name: Resolve hadolint threshold
        id: thr
        working-directory: ${{ github.workspace }}
        run: |
          FILE="_containerdevops/scripts/docker.profile.thresholds.yml"
          if [[ ! -f "$FILE" ]]; then
            echo "missing vendored thresholds at $FILE" >&2
            exit 1
          fi
          VALUE="$(bash _containerdevops/scripts/read-thresholds.sh hadolint_failure_threshold "$FILE")"
          if [[ -z "$VALUE" ]]; then
            echo "empty hadolint_failure_threshold from $FILE" >&2
            exit 1
          fi
          echo "hadolint=${VALUE}" >> "$GITHUB_OUTPUT"

      - name: hadolint (host)
        if: inputs.runner_image == ''
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          hadolint --failure-threshold "${{ steps.thr.outputs.hadolint }}" \
            "${{ inputs.dockerfile }}"

      - name: hadolint (runner_image)
        if: inputs.runner_image != ''
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          docker run --rm -v "${{ github.workspace }}:/work:ro" -w "/work/${{ inputs.working_directory }}" \
            "${{ inputs.runner_image }}" \
            hadolint --failure-threshold "${{ steps.thr.outputs.hadolint }}" \
            "${{ inputs.dockerfile }}"

      - name: shellcheck entrypoints (host)
        if: inputs.shell_scripts != '' && inputs.runner_image == ''
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          # shellcheck disable=SC2086
          shellcheck ${{ inputs.shell_scripts }}

      - name: shellcheck entrypoints (runner_image)
        if: inputs.shell_scripts != '' && inputs.runner_image != ''
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          # shellcheck disable=SC2086
          docker run --rm -v "${{ github.workspace }}:/work:ro" -w "/work/${{ inputs.working_directory }}" \
            "${{ inputs.runner_image }}" \
            shellcheck ${{ inputs.shell_scripts }}

  infra:
    # CI-024 — pin updated after commondevops 1.0.0 lands (placeholder until then).
    if: github.actor != 'dependabot[bot]' && inputs.run_infra_lint != false
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@74695e83a7b79784ee81fd970d9051d8efd711e8
    with:
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.working_directory }}
      shell_scripts: ${{ inputs.shell_scripts }}
      dockerfiles: ${{ inputs.dockerfile }}
      scripts_ref: 74695e83a7b79784ee81fd970d9051d8efd711e8
    secrets:
      checkout_token: ${{ secrets.checkout_token }}

  secrets:
    # CI-024 / DOCKER-SEC-005
    if: github.actor != 'dependabot[bot]' && inputs.run_secrets_scan != false
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@74695e83a7b79784ee81fd970d9051d8efd711e8
    with:
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.working_directory }}
      scripts_ref: 74695e83a7b79784ee81fd970d9051d8efd711e8
    secrets:
      checkout_token: ${{ secrets.checkout_token }}
