name: Container Lint (reusable)

# Hadolint with docker profile thresholds stays here (ci-container image).
# actionlint / shellcheck / zizmor → commondevops common-infra-lint.
# Secrets (DOCKER-SEC-005) → commondevops common-secrets-sast.
# commondevops pin: 74695e83a7b79784ee81fd970d9051d8efd711e8 (scripts_ref in lockstep).

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Path to Dockerfile
        required: false
        type: string
        default: Dockerfile
      working_directory:
        description: Repo subdirectory containing the Dockerfile
        required: false
        type: string
        default: .
      blocking:
        description: When false, failures are advisory only
        required: false
        type: boolean
        default: false
      shell_scripts:
        description: Glob or space-separated entrypoint scripts to shellcheck
        required: false
        type: string
        default: ""
      scripts_ref:
        description: "Commit/tag/branch of this repo to checkout for scripts (must match uses: pin)"
        required: false
        type: string
        default: ""
      run_infra_lint:
        description: Call common-infra-lint (actionlint/shellcheck/zizmor/hadolint)
        required: false
        type: boolean
        default: true
      run_secrets_scan:
        description: Call common-secrets-sast (DOCKER-SEC-005)
        required: false
        type: boolean
        default: true
    secrets:
      checkout_token:
        required: false
  workflow_dispatch:
    inputs:
      dockerfile:
        type: string
        default: Dockerfile
      working_directory:
        type: string
        default: .
      blocking:
        type: boolean
        default: false
      shell_scripts:
        type: string
        default: ""
      scripts_ref:
        type: string
        default: ""

# CI-025
permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    # Prefer :local until ghcr.io/pirlruc/ci-container is published.
    container: ghcr.io/pirlruc/ci-container:latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout containerdevops scripts
        # CI-024: nested private checkout may need checkout_token
        if: github.actor != 'dependabot[bot]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/containerdevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _containerdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Resolve hadolint threshold
        id: thr
        working-directory: ${{ github.workspace }}
        run: |
          FILE="_containerdevops/scripts/docker.profile.thresholds.yml"
          if [[ ! -f "$FILE" ]]; then
            FILE="docs/guardrails/docker/profile.thresholds.yml"
          fi
          VALUE="$(bash _containerdevops/scripts/read-thresholds.sh hadolint_failure_threshold "$FILE")"
          if [[ -z "$VALUE" ]]; then
            echo "empty hadolint_failure_threshold from $FILE" >&2
            exit 1
          fi
          echo "hadolint=${VALUE}" >> "$GITHUB_OUTPUT"

      - name: hadolint
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          hadolint --failure-threshold "${{ steps.thr.outputs.hadolint }}" \
            "${{ inputs.dockerfile }}"

      - name: shellcheck entrypoints
        if: inputs.shell_scripts != ''
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          # shellcheck disable=SC2086
          shellcheck ${{ inputs.shell_scripts }}

  infra:
    # CI-024
    if: github.actor != 'dependabot[bot]' && inputs.run_infra_lint != false
    uses: pirlruc/commondevops/.github/workflows/common-infra-lint.yml@74695e83a7b79784ee81fd970d9051d8efd711e8
    with:
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.working_directory }}
      shell_scripts: ${{ inputs.shell_scripts }}
      dockerfiles: ${{ inputs.dockerfile }}
      scripts_ref: 74695e83a7b79784ee81fd970d9051d8efd711e8
    secrets:
      checkout_token: ${{ secrets.checkout_token }}

  secrets:
    # CI-024 / DOCKER-SEC-005
    if: github.actor != 'dependabot[bot]' && inputs.run_secrets_scan != false
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@74695e83a7b79784ee81fd970d9051d8efd711e8
    with:
      blocking: ${{ inputs.blocking }}
      working_directory: ${{ inputs.working_directory }}
      scripts_ref: 74695e83a7b79784ee81fd970d9051d8efd711e8
    secrets:
      checkout_token: ${{ secrets.checkout_token }}
