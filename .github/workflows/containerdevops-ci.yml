name: Containerdevops CI (self)

on:
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail jobs on gate errors
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: containerdevops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025 / CI-031 — caller grants the max scopes callees may request.
permissions: {}

jobs:
  pins:
    # Token-free (CI-024): Dependabot PRs still get a submodule pin signal.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SC-DEP-004 submodule pin assert
        run: sh scripts/check-submodule-pins.sh

  docs:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-doc-verify.yml@b3c462bed0de4f6475e6be7875c4ababd831acc6
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      shell_scripts: scripts/*.sh
      ruff_paths: scripts/lint-doc-links.py scripts/validate-yaml.py
      yaml_files: docs/issues.yml docs/guardrail-deviations.yml .github/dependabot.yml
      yaml_globs: .github/workflows/*.yml
      run_link_lint: true
      scripts_ref: b3c462bed0de4f6475e6be7875c4ababd831acc6
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  scaffold:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-scaffold-verify.yml@b3c462bed0de4f6475e6be7875c4ababd831acc6
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      scripts_ref: b3c462bed0de4f6475e6be7875c4ababd831acc6

  lint:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/container-lint.yml
    with:
      dockerfile: docker/ci-container/Dockerfile
      working_directory: .
      shell_scripts: scripts/*.sh
      scripts_ref: ${{ github.sha }}
      runner_image: ""
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  iac:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/container-iac.yml
    with:
      paths: .
      scripts_ref: ${{ github.sha }}
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
