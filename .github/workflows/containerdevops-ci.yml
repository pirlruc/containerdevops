name: Containerdevops CI (self)

on:
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail jobs on gate errors
        type: boolean
        default: false
  # CI-024: push stays on main. Do not add dependabot/**.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: containerdevops-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI-025 / CI-031 — caller grants the max scopes callees may request.
permissions: {}

jobs:
  pins:
    # Token-free (CI-024): Dependabot PRs still get a submodule pin signal.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: SC-DEP-004 submodule pin assert
        run: sh scripts/check-submodule-pins.sh

  docs:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-doc-verify.yml@0b37bd52212bbe0d6eac70f955203d7582dfd9da
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      shell_scripts: scripts/*.sh
      ruff_paths: scripts/lint-doc-links.py scripts/validate-yaml.py
      yaml_files: docs/issues.yml docs/guardrail-deviations.yml .github/dependabot.yml
      yaml_globs: .github/workflows/*.yml
      run_link_lint: true
      scripts_ref: 0b37bd52212bbe0d6eac70f955203d7582dfd9da
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  scaffold:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-scaffold-verify.yml@0b37bd52212bbe0d6eac70f955203d7582dfd9da
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      scripts_ref: 0b37bd52212bbe0d6eac70f955203d7582dfd9da

  lint:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/container-lint.yml
    with:
      dockerfile: docker/ci-container/Dockerfile
      working_directory: .
      shell_scripts: scripts/*.sh
      scripts_ref: ${{ github.sha }}
      runner_image: ""
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  # Token-free merge signal for Dependabot (CI-024). No Actions secrets, no submodules.
  lint-dependabot:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install host linters
        env:
          INSTALL_ONLY: actionlint,shellcheck,hadolint
        run: bash scripts/install-container-tools.sh
      - name: actionlint
        run: actionlint -color=false .github/workflows/*.yml
      - name: shellcheck
        run: find scripts -name '*.sh' -print0 | xargs -0 shellcheck
      - name: hadolint
        run: |
          set -euo pipefail
          HADOLINT_THRESHOLD="$(bash scripts/read-thresholds.sh hadolint_failure_threshold scripts/docker.profile.thresholds.yml)"
          export HADOLINT_THRESHOLD
          DOCKERFILES="$(printf '%s\n' docker/ci-container/Dockerfile docker/ci-container/Dockerfile.alpine)"
          export DOCKERFILES
          bash scripts/lint-dockerfiles.sh
      - name: zizmor
        run: |
          docker run --rm -v "${PWD}:/src" -w /src \
            pirlruc/ci-lint@sha256:e0a51c64b004c6f4e4ca1672f3bb865aaf03d91bd8a2e228e0fa39be1174dfb4 \
            zizmor --min-severity=low .github/workflows

  iac:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/container-iac.yml
    with:
      paths: .
      scripts_ref: ${{ github.sha }}
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
