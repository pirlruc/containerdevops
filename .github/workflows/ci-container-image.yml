---
# Thin caller — publishes ghcr.io/pirlruc/ci-container (CI-026).
# Debian and Alpine variants; Alpine owns unsuffixed tags (follows ci-lint 5.1.1).
# Pins to this repo's reusable workflows at the same commit (scripts_ref in lockstep).
# CI_BASE digests are centralised in env below — update once per commondevops release.
# 5.0.2: compose GHCR ref from handoff_package + digest (image_ref is secret-masked).
name: CI Container Image

on:
  release:
    types: [published]
  schedule:
    # Monthly rebuild for CI-027 / DOCKER-BUILD-006 cadence (1st 05:17 UTC).
    - cron: "17 5 1 * *"
  pull_request:
    branches: [main]
    paths:
      - "docker/ci-container/**"
      - ".github/workflows/ci-container-image.yml"
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail the job on gate errors
        type: boolean
        default: false
      publish:
        description: Publish to GHCR (also on release / schedule)
        type: boolean
        default: false
      ci_base_debian:
        description: Digest-pinned ci-lint Debian ref for FROM (CI-026)
        type: string
        default: ""
      ci_base_alpine:
        description: Digest-pinned ci-lint Alpine ref for FROM (CI-026)
        type: string
        default: ""

concurrency:
  group: ci-container-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Centralise CI_BASE digests once (reusable-workflow `with:` cannot use env).
  # Update these two lines when commondevops publishes a new ci-lint.
  bases:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      debian: ${{ steps.set.outputs.debian }}
      alpine: ${{ steps.set.outputs.alpine }}
    steps:
      - id: set
        run: |
          # commondevops ci-lint 5.2.2 — Alpine owns unsuffixed tags (CI-026)
          {
            echo "debian=ghcr.io/pirlruc/ci-lint@sha256:2cb20ba2d39f55ccc4195acc162013162682cb3bcccc31c300261965ca9b30c1"
            echo "alpine=ghcr.io/pirlruc/ci-lint@sha256:fd24e836c677e044163aab19e1e7d49d92ce34576deb7970b1ae16ea52b36d1b"
          } >> "$GITHUB_OUTPUT"

  lint:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/container-lint.yml
    with:
      dockerfile: docker/ci-container/Dockerfile
      working_directory: .
      scripts_ref: ${{ github.sha }}
      runner_image: ""
      run_infra_lint: true
      run_secrets_scan: true
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  lint-alpine:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/container-lint.yml
    with:
      dockerfile: docker/ci-container/Dockerfile.alpine
      working_directory: .
      scripts_ref: ${{ github.sha }}
      runner_image: ""
      run_infra_lint: false
      run_secrets_scan: true
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  # Build/scan on PR once CI_BASE resolves from GHCR (ci-lint 5.1.1 published).
  build:
    needs: [lint, lint-alpine, bases]
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-build.yml
    with:
      context: docker/ci-container
      dockerfile: docker/ci-container/Dockerfile
      image_name: ci-container:ci-debian
      artifact_name: container-image-debian
      handoff_package: ci-container
      structure_test_config: docker/ci-container/container-structure-test.yml
      scripts_ref: ${{ github.sha }}
      platforms: linux/amd64
      size_class: ci_toolchain
      build_args: |
        CI_BASE=${{ (github.event_name == 'workflow_dispatch' && inputs.ci_base_debian != '') && inputs.ci_base_debian || needs.bases.outputs.debian }}
      image_title: ci-container
      image_description: >-
        Short-lived CI toolchain image for container jobs: ci-lint plus dive and
        container-structure-test. Debian 13 variant. Non-root 1000:1000, linux/amd64.
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      dhi_login: false
    secrets:
      ghcr_token: ${{ secrets.GHCR_READ_TOKEN }}

  build-alpine:
    needs: [lint, lint-alpine, bases]
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container-build.yml
    with:
      context: docker/ci-container
      dockerfile: docker/ci-container/Dockerfile.alpine
      image_name: ci-container:ci-alpine
      artifact_name: container-image-alpine
      handoff_package: ci-container
      structure_test_config: docker/ci-container/container-structure-test.yml
      scripts_ref: ${{ github.sha }}
      platforms: linux/amd64
      size_class: ci_toolchain
      build_args: |
        CI_BASE=${{ (github.event_name == 'workflow_dispatch' && inputs.ci_base_alpine != '') && inputs.ci_base_alpine || needs.bases.outputs.alpine }}
      image_title: ci-container
      image_description: >-
        Short-lived CI toolchain image for container jobs: ci-lint plus dive and
        container-structure-test. Alpine 3.24 variant. Non-root 1000:1000, linux/amd64.
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}
      dhi_login: false
    secrets:
      ghcr_token: ${{ secrets.GHCR_READ_TOKEN }}

  scan:
    needs: build
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
      packages: read
    uses: ./.github/workflows/container-scan.yml
    with:
      image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build.outputs.handoff_package, needs.build.outputs.digest) }}
      results_artifact: container-scan-results-debian
      sarif_category: trivy-image-debian
      scripts_ref: ${{ github.sha }}
      pkg_types: library
      ignorefile: docker/ci-container/.trivyignore.yaml
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}

  scan-alpine:
    needs: build-alpine
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      security-events: write
      packages: read
    uses: ./.github/workflows/container-scan.yml
    with:
      image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build-alpine.outputs.handoff_package, needs.build-alpine.outputs.digest) }}
      results_artifact: container-scan-results-alpine
      sarif_category: trivy-image-alpine
      scripts_ref: ${{ github.sha }}
      pkg_types: library
      ignorefile: docker/ci-container/.trivyignore.yaml
      blocking: ${{ github.event_name == 'workflow_dispatch' && inputs.blocking || github.event_name != 'workflow_dispatch' }}

  publish:
    needs: [build, scan, bases]
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name == 'release' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/container-publish.yml
    with:
      context: docker/ci-container
      dockerfile: docker/ci-container/Dockerfile
      image_name: ci-container
      dockerhub_image: pirlruc/ci-container
      scripts_ref: ${{ github.sha }}
      platforms: linux/amd64
      tag_suffix: -debian
      tag_alias_unsuffixed: false
      build_args: |
        CI_BASE=${{ (github.event_name == 'workflow_dispatch' && inputs.ci_base_debian != '') && inputs.ci_base_debian || needs.bases.outputs.debian }}
      image_title: ci-container
      image_description: >-
        Short-lived CI toolchain image for container jobs: ci-lint plus dive and
        container-structure-test. Debian 13 variant. Non-root 1000:1000, linux/amd64.
      image_documentation: https://hub.docker.com/r/pirlruc/ci-container
      image_url: https://hub.docker.com/r/pirlruc/ci-container
      image_vendor: pirlruc
      dockerhub_readme: docs/docker-hub.md
      dockerhub_short_description: >-
        CI toolchain: ci-lint plus dive and container-structure-test
      structure_test_config: docker/ci-container/container-structure-test.yml
      sign: ${{ github.event.repository.visibility == 'public' }}
      blocking: true
      dhi_login: false
      # Release refs are not branch refs; schedule/dispatch on main get latest
      # from container-publish.yml without passing tag_latest (CDO-WF-003).
      tag_latest: ${{ github.event_name == 'release' && github.event.release.prerelease == false }}
      verify_platforms: true
      verify_command: /bin/true
      source_image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build.outputs.handoff_package, needs.build.outputs.digest) }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ghcr_token: ${{ secrets.GHCR_READ_TOKEN }}

  publish-alpine:
    needs: [build-alpine, scan-alpine, bases]
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name == 'release' ||
       github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish))
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/container-publish.yml
    with:
      context: docker/ci-container
      dockerfile: docker/ci-container/Dockerfile.alpine
      image_name: ci-container
      dockerhub_image: pirlruc/ci-container
      scripts_ref: ${{ github.sha }}
      platforms: linux/amd64
      tag_suffix: -alpine
      tag_alias_unsuffixed: true
      build_args: |
        CI_BASE=${{ (github.event_name == 'workflow_dispatch' && inputs.ci_base_alpine != '') && inputs.ci_base_alpine || needs.bases.outputs.alpine }}
      image_title: ci-container
      image_description: >-
        Short-lived CI toolchain image for container jobs: ci-lint plus dive and
        container-structure-test. Alpine 3.24 variant (default unsuffixed tags).
        Non-root 1000:1000, linux/amd64.
      image_documentation: https://hub.docker.com/r/pirlruc/ci-container
      image_url: https://hub.docker.com/r/pirlruc/ci-container
      image_vendor: pirlruc
      dockerhub_readme: docs/docker-hub.md
      dockerhub_short_description: >-
        CI toolchain: ci-lint plus dive and container-structure-test
      structure_test_config: docker/ci-container/container-structure-test.yml
      sign: ${{ github.event.repository.visibility == 'public' }}
      blocking: true
      dhi_login: false
      # Release refs are not branch refs; schedule/dispatch on main get latest
      # from container-publish.yml without passing tag_latest (CDO-WF-003).
      tag_latest: ${{ github.event_name == 'release' && github.event.release.prerelease == false }}
      verify_platforms: true
      verify_command: /bin/true
      source_image: ${{ format('ghcr.io/{0}/{1}@{2}', github.repository_owner, needs.build-alpine.outputs.handoff_package, needs.build-alpine.outputs.digest) }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ghcr_token: ${{ secrets.GHCR_READ_TOKEN }}

  # Delete the ephemeral tag when this run did not publish. After publish retag
  # the same digest carries version/latest — never delete that version.
  cleanup:
    needs: [build, scan, publish]
    if: always() && needs.build.outputs.handoff_tag != '' && needs.publish.result != 'success'
    permissions:
      packages: write
    uses: ./.github/workflows/container-handoff-cleanup.yml
    with:
      package: ${{ needs.build.outputs.handoff_package }}
      tag: ${{ needs.build.outputs.handoff_tag }}

  cleanup-alpine:
    needs: [build-alpine, scan-alpine, publish-alpine]
    if: always() && needs.build-alpine.outputs.handoff_tag != '' && needs.publish-alpine.result != 'success'
    permissions:
      packages: write
    uses: ./.github/workflows/container-handoff-cleanup.yml
    with:
      package: ${{ needs.build-alpine.outputs.handoff_package }}
      tag: ${{ needs.build-alpine.outputs.handoff_tag }}
