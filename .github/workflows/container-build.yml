name: Container Build (reusable)

on:
  workflow_call:
    inputs:
      context:
        required: false
        type: string
        default: .
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      image_name:
        description: Local tag for the loaded image
        required: false
        type: string
        default: containerdevops-ci:local
      structure_test_config:
        required: false
        type: string
        default: container-structure-test.yml
      platforms:
        description: Platforms for buildx (load supports single platform)
        required: false
        type: string
        default: linux/amd64
      blocking:
        required: false
        type: boolean
        default: false
      dhi_login:
        description: Log in to dhi.io before build (needs DOCKERHUB_* secrets)
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: "Commit/tag/branch of this repo to checkout for scripts (must match uses: pin)"
        required: false
        type: string
        default: ""
      build_args:
        description: Newline-separated Docker build-args (KEY=value)
        required: false
        type: string
        default: ""
      image_max_size_mb:
        description: Override DOCKER-PERF-001 image_max_size_mb (empty = vendored threshold)
        required: false
        type: string
        default: ""
      image_title:
        description: OCI title label (defaults to image_name)
        required: false
        type: string
        default: ""
      image_description:
        description: OCI description label (consumer-facing; empty uses image_name)
        required: false
        type: string
        default: ""
      artifact_name:
        description: Upload artifact name for image.tar (unique when multiple builds share a run)
        required: false
        type: string
        default: container-image
    secrets:
      # Optional — required when Dockerfile FROM lines pull from dhi.io (Community DHI).
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      scripts_token:
        description: Token to read this repo scripts when called cross-repo; defaults to github.token
        required: false
      ghcr_token:
        description: >-
          Optional token with packages:read for private GHCR base pulls (cross-repo).
          Defaults to github.token (works when package Actions access is granted or public).
        required: false
  workflow_dispatch:
    # Capped at 10 inputs (GitHub limit); artifact_name / image_title /
    # image_description are workflow_call-only.
    inputs:
      context:
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile
      image_name:
        type: string
        default: containerdevops-ci:local
      structure_test_config:
        type: string
        default: container-structure-test.yml
      platforms:
        type: string
        default: linux/amd64
      blocking:
        type: boolean
        default: false
      dhi_login:
        type: boolean
        default: false
      scripts_ref:
        type: string
        default: ""
      build_args:
        type: string
        default: ""
      image_max_size_mb:
        type: string
        default: ""

# CI-025
permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  build:
    # Build/publish stay on plain runner (no container:) — needs buildx/docker.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout containerdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/containerdevops
          # github.workflow_sha is the *caller* workflow; pass scripts_ref matching uses: @pin.
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.scripts_token || github.token }}  # cross-repo: scripts_token; same-repo: github.token
          persist-credentials: false
          path: _containerdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr_token || github.token }}

      - name: Log in to dhi.io
        # CI-024: Dependabot cannot use Actions secrets
        if: inputs.dhi_login && github.actor != 'dependabot[bot]'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install tooling
        env:
          INSTALL_ONLY: container-structure-test,dive
        run: bash _containerdevops/scripts/install-container-tools.sh

      - name: Base image age gate (DOCKER-BUILD-006)
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: |
          FILE="_containerdevops/scripts/docker.profile.thresholds.yml"
          if [[ ! -f "$FILE" ]]; then
            echo "missing vendored thresholds at $FILE" >&2
            exit 1
          fi
          MAX="$(bash _containerdevops/scripts/read-thresholds.sh base_image_max_age_days "$FILE")"
          bash _containerdevops/scripts/check-base-image-age.sh \
            "${DOCKERFILE}" "${MAX}"

      - name: Build (load)
        id: build
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: ${{ inputs.image_name }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build_args }}
          # Per-variant scope so parallel debian/alpine builds do not thrash one cache.
          cache-from: type=gha,scope=${{ inputs.artifact_name }}
          cache-to: type=gha,mode=max,scope=${{ inputs.artifact_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ inputs.image_title != '' && inputs.image_title || inputs.image_name }}
            org.opencontainers.image.description=${{ inputs.image_description != '' && inputs.image_description || inputs.image_name }}

      - name: container-structure-test
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          STRUCTURE_TEST_CONFIG: ${{ inputs.structure_test_config }}
        run: |
          if [[ -z "${STRUCTURE_TEST_CONFIG}" ]]; then
            echo "structure_test_config empty — skipping"
            exit 0
          fi
          if [[ ! -f "${STRUCTURE_TEST_CONFIG}" ]]; then
            echo "structure_test_config not found: ${STRUCTURE_TEST_CONFIG} — skipping"
            exit 0
          fi
          container-structure-test test \
            --image "${IMAGE_NAME}" \
            --config "${STRUCTURE_TEST_CONFIG}"

      - name: Image size gate
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_MAX_SIZE_MB_OVERRIDE: ${{ inputs.image_max_size_mb }}
        run: |
          FILE="_containerdevops/scripts/docker.profile.thresholds.yml"
          [[ -f "$FILE" ]] || FILE="docs/guardrails/docker/profile.thresholds.yml"
          if [[ -n "${IMAGE_MAX_SIZE_MB_OVERRIDE}" ]]; then
            MAX="${IMAGE_MAX_SIZE_MB_OVERRIDE}"
            echo "Using caller image_max_size_mb override=${MAX}"
          else
            MAX="$(bash _containerdevops/scripts/read-thresholds.sh image_max_size_mb "$FILE")"
          fi
          bash _containerdevops/scripts/check-image-size.sh "${IMAGE_NAME}" "${MAX}"

      - name: Dive efficiency
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          FILE="_containerdevops/scripts/docker.profile.thresholds.yml"
          [[ -f "$FILE" ]] || FILE="docs/guardrails/docker/profile.thresholds.yml"
          MIN="$(bash _containerdevops/scripts/read-thresholds.sh min_image_efficiency_percent "$FILE")"
          set +e
          dive --ci --json dive-report.json "${IMAGE_NAME}"
          dive_rc=$?
          set -e
          if [[ ! -f dive-report.json ]]; then
            echo "dive failed without JSON (exit ${dive_rc}) — not an efficiency miss"
            [[ "${ADVISORY}" == "true" ]] || exit "${dive_rc}"
          else
            # dive --ci may exit non-zero on its own thresholds; org floor is enforced here.
            bash _containerdevops/scripts/check-image-efficiency.sh "${MIN}" dive-report.json
          fi

      - name: Save image tarball
        if: always()
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          if ! docker image inspect "${IMAGE_NAME}" >/dev/null 2>&1; then
            echo "No image ${IMAGE_NAME} to save"
            exit 0
          fi
          docker save "${IMAGE_NAME}" -o image.tar
          docker image inspect "${IMAGE_NAME}" --format '{{.Id}}' > image-id.txt

      - name: Upload image artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            image.tar
            image-id.txt
            dive-report.json
          if-no-files-found: ignore
          retention-days: 3
