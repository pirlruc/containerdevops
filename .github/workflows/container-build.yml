name: Container Build (reusable)

on:
  workflow_call:
    inputs:
      context:
        required: false
        type: string
        default: .
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      image_name:
        description: Local tag for the loaded image
        required: false
        type: string
        default: containerdevops-ci:local
      structure_test_config:
        required: false
        type: string
        default: container-structure-test.yml
      platforms:
        description: Platforms for buildx (load supports single platform)
        required: false
        type: string
        default: linux/amd64
      blocking:
        required: false
        type: boolean
        default: false
      dhi_login:
        description: Log in to dhi.io before build (needs DOCKERHUB_* secrets)
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: "Commit/tag/branch of this repo to checkout for scripts (must match uses: pin)"
        required: false
        type: string
        default: ""
      build_args:
        description: Newline-separated Docker build-args (KEY=value)
        required: false
        type: string
        default: ""
      image_max_size_mb:
        description: Override size floor in MB (empty = vendored threshold for size_class)
        required: false
        type: string
        default: ""
      size_class:
        description: "application (image_max_size_mb) or ci_toolchain (ci_image_max_size_mb / DOCKER-PERF-002)"
        required: false
        type: string
        default: application
      image_title:
        description: OCI title label (defaults to image_name)
        required: false
        type: string
        default: ""
      image_description:
        description: OCI description label (consumer-facing; empty uses image_name)
        required: false
        type: string
        default: ""
      artifact_name:
        description: Cache scope and ephemeral GHCR tag suffix (unique when multiple builds share a run)
        required: false
        type: string
        default: container-image
      upload_image_artifact:
        description: Also upload image.tar (legacy handoff). Default false — scan should pull image_ref.
        required: false
        type: boolean
        default: false
      handoff_package:
        description: "GHCR package name for the ephemeral push (default: image_name before colon)"
        required: false
        type: string
        default: ""
    outputs:
      image_ref:
        description: "pkg@sha256:… without registry/owner; callers prepend ghcr.io/<owner>/"
        value: ${{ jobs.build.outputs.image_ref }}
      digest:
        description: "Image digest (sha256:…)"
        value: ${{ jobs.build.outputs.digest }}
      handoff_tag:
        description: Ephemeral ci-run-* tag (delete after PR scan; do not delete after publish retag)
        value: ${{ jobs.build.outputs.handoff_tag }}
      handoff_package:
        description: GHCR package name that received the ephemeral tag
        value: ${{ jobs.build.outputs.handoff_package }}
    secrets:
      # Optional — required when Dockerfile FROM lines pull from dhi.io (Community DHI).
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      scripts_token:
        description: Token to read this repo scripts when called cross-repo; defaults to github.token
        required: false
      ghcr_token:
        description: >-
          Optional token with packages:read for private GHCR base pulls (cross-repo).
          Defaults to github.token (works when package Actions access is granted or public).
        required: false
  workflow_dispatch:
    # Capped at 10 inputs (GitHub limit); artifact_name / image_title /
    # image_description are workflow_call-only.
    inputs:
      context:
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile
      image_name:
        type: string
        default: containerdevops-ci:local
      structure_test_config:
        type: string
        default: container-structure-test.yml
      platforms:
        type: string
        default: linux/amd64
      blocking:
        type: boolean
        default: false
      dhi_login:
        type: boolean
        default: false
      scripts_ref:
        type: string
        default: ""
      build_args:
        type: string
        default: ""
      image_max_size_mb:
        type: string
        default: ""

# CI-025
permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}
  DOCKER_BUILD_SUMMARY: "false"
  DOCKER_BUILD_RECORD_RETENTION_DAYS: "0"

jobs:
  build:
    # Build/publish stay on plain runner (no container:) — needs buildx/docker.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.handoff.outputs.image_ref }}
      digest: ${{ steps.handoff.outputs.digest }}
      handoff_tag: ${{ steps.handoff.outputs.handoff_tag }}
      handoff_package: ${{ steps.handoff.outputs.handoff_package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout containerdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/containerdevops
          # github.workflow_sha is the *caller* workflow; pass scripts_ref matching uses: @pin.
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.scripts_token || github.token }}  # cross-repo: scripts_token; same-repo: github.token
          persist-credentials: false
          path: _containerdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr_token || github.token }}

      - name: Log in to dhi.io
        # CI-024: Dependabot cannot use Actions secrets
        if: inputs.dhi_login && github.actor != 'dependabot[bot]'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install tooling
        env:
          INSTALL_ONLY: container-structure-test,dive
        run: bash _containerdevops/scripts/install-container-tools.sh

      - name: Require scripts_ref for cross-repo callers (CI-034)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${REPO}" != "pirlruc/containerdevops" && -z "${SCRIPTS_REF}" ]]; then
            echo "CI-034: cross-repo callers must pass scripts_ref matching the uses: pin" >&2
            exit 1
          fi

      - name: Resolve docker thresholds
        id: thr
        env:
          IMAGE_MAX_SIZE_MB_OVERRIDE: ${{ inputs.image_max_size_mb }}
          SIZE_CLASS: ${{ inputs.size_class }}
        run: |
          set -euo pipefail
          FILE="_containerdevops/scripts/docker.profile.thresholds.yml"
          if [[ ! -f "$FILE" ]]; then
            echo "missing vendored thresholds at $FILE" >&2
            exit 1
          fi
          AGE="$(bash _containerdevops/scripts/read-thresholds.sh base_image_max_age_days "$FILE")"
          MIN="$(bash _containerdevops/scripts/read-thresholds.sh min_image_efficiency_percent "$FILE")"
          SIZE_CLASS="${SIZE_CLASS:-application}"
          if [[ -n "${IMAGE_MAX_SIZE_MB_OVERRIDE}" ]]; then
            MAX="${IMAGE_MAX_SIZE_MB_OVERRIDE}"
            echo "Using caller image_max_size_mb override=${MAX}"
          else
            case "${SIZE_CLASS}" in
              application) KEY=image_max_size_mb ;;
              ci_toolchain) KEY=ci_image_max_size_mb ;;
              *)
                echo "unknown size_class '${SIZE_CLASS}' (application|ci_toolchain)" >&2
                exit 1
                ;;
            esac
            MAX="$(bash _containerdevops/scripts/read-thresholds.sh "${KEY}" "$FILE")"
            echo "size_class=${SIZE_CLASS} key=${KEY} max=${MAX}"
          fi
          {
            echo "age=${AGE}"
            echo "min_eff=${MIN}"
            echo "max_mb=${MAX}"
          } >> "$GITHUB_OUTPUT"

      - name: Base image age gate (DOCKER-BUILD-006)
        id: age
        continue-on-error: true
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          MAX: ${{ steps.thr.outputs.age }}
        run: |
          set -euo pipefail
          bash _containerdevops/scripts/check-base-image-age.sh \
            "${DOCKERFILE}" "${MAX}"

      - name: Build (load)
        id: build
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: ${{ inputs.image_name }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build_args }}
          # Per-variant scope so parallel debian/alpine builds do not thrash one cache.
          cache-from: type=gha,scope=${{ inputs.artifact_name }}
          cache-to: type=gha,mode=min,scope=${{ inputs.artifact_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ inputs.image_title != '' && inputs.image_title || inputs.image_name }}
            org.opencontainers.image.description=${{ inputs.image_description != '' && inputs.image_description || inputs.image_name }}

      - name: container-structure-test
        id: cst
        continue-on-error: true
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          STRUCTURE_TEST_CONFIG: ${{ inputs.structure_test_config }}
        run: |
          set -euo pipefail
          if [[ -z "${STRUCTURE_TEST_CONFIG}" ]]; then
            echo "structure_test_config empty — skipping"
            exit 0
          fi
          if [[ ! -f "${STRUCTURE_TEST_CONFIG}" ]]; then
            echo "structure_test_config not found: ${STRUCTURE_TEST_CONFIG}" >&2
            exit 1
          fi
          container-structure-test test \
            --image "${IMAGE_NAME}" \
            --config "${STRUCTURE_TEST_CONFIG}"

      - name: Image size gate
        id: size
        continue-on-error: true
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          MAX: ${{ steps.thr.outputs.max_mb }}
        run: |
          set -euo pipefail
          bash _containerdevops/scripts/check-image-size.sh "${IMAGE_NAME}" "${MAX}"

      - name: Dive efficiency
        id: dive
        continue-on-error: true
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          MIN: ${{ steps.thr.outputs.min_eff }}
        run: |
          set -euo pipefail
          set +e
          dive --ci --json dive-report.json "${IMAGE_NAME}"
          dive_rc=$?
          set -e
          if [[ ! -f dive-report.json ]]; then
            echo "dive failed without JSON (exit ${dive_rc}) — not an efficiency miss" >&2
            exit "${dive_rc}"
          fi
          bash _containerdevops/scripts/check-image-efficiency.sh "${MIN}" dive-report.json

      - name: Gate — build
        if: always()
        env:
          ADVISORY: ${{ env.ADVISORY }}
          BUILD: ${{ steps.build.outcome }}
          AGE: ${{ steps.age.outcome }}
          CST: ${{ steps.cst.outcome }}
          SIZE: ${{ steps.size.outcome }}
          DIVE: ${{ steps.dive.outcome }}
        run: |
          set -euo pipefail
          bash _containerdevops/scripts/gate-aggregate.sh \
            build="${BUILD}" age="${AGE}" cst="${CST}" size="${SIZE}" dive="${DIVE}"

      - name: Push ephemeral GHCR handoff
        id: handoff
        # Do not use `if: always()` — reusable-workflow job outputs from always()
        # steps are empty for the caller (needs.*.outputs.image_ref).
        if: steps.build.outcome == 'success'
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
          HANDOFF_PACKAGE: ${{ inputs.handoff_package }}
          OWNER: ${{ github.repository_owner }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          pkg="${HANDOFF_PACKAGE}"
          if [[ -z "${pkg}" ]]; then
            pkg="${IMAGE_NAME%%:*}"
          fi
          suffix="${ARTIFACT_NAME}"
          suffix="${suffix#container-image-}"
          suffix="${suffix#container-image}"
          if [[ -z "${suffix}" ]]; then
            suffix="default"
          fi
          tag="ci-run-${RUN_ID}-${suffix}"
          dest="ghcr.io/${OWNER}/${pkg}:${tag}"
          docker tag "${IMAGE_NAME}" "${dest}"
          docker push "${dest}"
          # Always emit a digest. RepoDigests[0] can omit the registry prefix.
          digest="$(docker image inspect "${dest}" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | awk -F@ -v p="ghcr.io/${OWNER}/${pkg}@" '$0 ~ p {print $2; exit}')"
          if [[ -z "${digest}" || "${digest}" != sha256:* ]]; then
            echo "push succeeded but GHCR digest missing" >&2
            exit 1
          fi
          # Do not put repository_owner into image_ref. If a job secret
          # (DOCKERHUB_USERNAME) equals the owner, Actions drops that output
          # ("Skip output since it may contain secret") and callers scan "".
          # Callers compose: ghcr.io/<owner>/<handoff_package>@<digest>
          # (do not put the owner into this output — secret masking).
          image_ref="${pkg}@${digest}"
          {
            echo "image_ref=${image_ref}"
            echo "digest=${digest}"
            echo "handoff_tag=${tag}"
            echo "handoff_package=${pkg}"
          } >> "$GITHUB_OUTPUT"
          echo "handoff ${image_ref} (compose ghcr.io/${OWNER}/${image_ref})"

      - name: Save image tarball (legacy)
        if: always() && inputs.upload_image_artifact
        env:
          IMAGE_NAME: ${{ inputs.image_name }}
        run: |
          if ! docker image inspect "${IMAGE_NAME}" >/dev/null 2>&1; then
            echo "No image ${IMAGE_NAME} to save"
            exit 0
          fi
          docker save "${IMAGE_NAME}" -o image.tar
          docker image inspect "${IMAGE_NAME}" --format '{{.Id}}' > image-id.txt

      - name: Upload image artifact (legacy)
        if: always() && inputs.upload_image_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            image.tar
            image-id.txt
            dive-report.json
          if-no-files-found: ignore
          retention-days: 1
