name: Container Build (reusable)

on:
  workflow_call:
    inputs:
      context:
        required: false
        type: string
        default: .
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      image_name:
        description: Local tag for the loaded image
        required: false
        type: string
        default: containerdevops-ci:local
      structure_test_config:
        required: false
        type: string
        default: container-structure-test.yml
      platforms:
        description: Platforms for buildx (load supports single platform)
        required: false
        type: string
        default: linux/amd64
      blocking:
        required: false
        type: boolean
        default: false
      dhi_login:
        description: Log in to dhi.io before build (needs DOCKERHUB_* secrets)
        required: false
        type: boolean
        default: false
    secrets:
      # Optional — required when Dockerfile FROM lines pull from dhi.io (Community DHI).
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      # Required when the caller is a different private repo (see container-lint.yml).
      checkout_token:
        required: false
  workflow_dispatch:
    inputs:
      context:
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile
      image_name:
        type: string
        default: containerdevops-ci:local
      structure_test_config:
        type: string
        default: container-structure-test.yml
      platforms:
        type: string
        default: linux/amd64
      blocking:
        type: boolean
        default: false
      dhi_login:
        type: boolean
        default: false

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout containerdevops scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: pirlruc/containerdevops
          ref: ${{ github.workflow_sha }}
          token: ${{ secrets.checkout_token || github.token }}
          path: _containerdevops
          sparse-checkout: |
            scripts
            docs/guardrails/docker
          sparse-checkout-cone-mode: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to dhi.io
        if: inputs.dhi_login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install tooling
        run: bash _containerdevops/scripts/install-container-tools.sh

      - name: Build (load)
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: ${{ inputs.image_name }}
          platforms: ${{ inputs.platforms }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: container-structure-test
        if: hashFiles(inputs.structure_test_config) != ''
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          container-structure-test test \
            --image "${{ inputs.image_name }}" \
            --config "${{ inputs.structure_test_config }}"

      - name: Image size gate
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          FILE="_containerdevops/docs/guardrails/docker/profile.thresholds.yml"
          [[ -f "$FILE" ]] || FILE="docs/guardrails/docker/profile.thresholds.yml"
          MAX="$(bash _containerdevops/scripts/read-thresholds.sh image_max_size_mb "$FILE")"
          bash _containerdevops/scripts/check-image-size.sh "${{ inputs.image_name }}" "${MAX}"

      - name: Dive efficiency
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          FILE="_containerdevops/docs/guardrails/docker/profile.thresholds.yml"
          [[ -f "$FILE" ]] || FILE="docs/guardrails/docker/profile.thresholds.yml"
          MIN="$(bash _containerdevops/scripts/read-thresholds.sh min_image_efficiency_percent "$FILE")"
          dive --ci --json dive-report.json "${{ inputs.image_name }}" || true
          if [[ -f dive-report.json ]]; then
            bash _containerdevops/scripts/check-image-efficiency.sh "${MIN}" dive-report.json
          else
            echo "dive JSON missing — treat as advisory miss"
            [[ "${{ env.ADVISORY }}" == "true" ]] || exit 1
          fi

      - name: Save image tarball
        if: always()
        run: |
          docker save "${{ inputs.image_name }}" -o image.tar
          docker image inspect "${{ inputs.image_name }}" --format '{{.Id}}' > image-id.txt

      - name: Upload image artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-image
          path: |
            image.tar
            image-id.txt
            dive-report.json
          if-no-files-found: ignore
          retention-days: 3
