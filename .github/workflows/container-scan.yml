name: Container Scan (reusable)

# Stays on the host runner: image_artifact uses `docker load` (needs the daemon).
# ci-container has scanners but not a Docker socket — see handoff.

on:
  workflow_call:
    inputs:
      image:
        description: Image ref to scan (local tag or registry)
        required: true
        type: string
      image_artifact:
        description: Optional artifact name containing image.tar to load first
        required: false
        type: string
        default: ""
      blocking:
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: "Commit/tag/branch of this repo to checkout for scripts (must match uses: pin)"
        required: false
        type: string
        default: ""
      pkg_types:
        description: Trivy --pkg-types (os,library or library for app-only / DHI OS noise)
        required: false
        type: string
        default: "os,library"
      ignorefile:
        description: "Trivy ignorefile path; empty falls back to .trivyignore.yaml/.trivyignore; set to 'none' to disable ignores"
        required: false
        type: string
        default: ""
      results_artifact:
        description: Upload artifact name for scan-results/ (unique when multiple scans share a run)
        required: false
        type: string
        default: container-scan-results
      sarif_category:
        description: Code scanning SARIF category (unique when multiple scans share a run)
        required: false
        type: string
        default: trivy-image
    secrets:
      scripts_token:
        description: Token to read this repo scripts when called cross-repo; defaults to github.token
        required: false
      ghcr_token:
        description: Optional PAT with read:packages when pulling a private GHCR image; defaults to github.token
        required: false
  workflow_dispatch:
    inputs:
      image:
        type: string
        required: true
      image_artifact:
        type: string
        default: ""
      blocking:
        type: boolean
        default: false
      scripts_ref:
        type: string
        default: ""
      pkg_types:
        type: string
        default: "os,library"
      ignorefile:
        type: string
        default: ""
      results_artifact:
        type: string
        default: container-scan-results
      sarif_category:
        type: string
        default: trivy-image

# CI-025
permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  scan:
    # CI-024: SARIF upload needs security-events
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout containerdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/containerdevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.scripts_token || github.token }}  # cross-repo: scripts_token; same-repo: github.token
          persist-credentials: false
          path: _containerdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Download image artifact
        if: inputs.image_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.image_artifact }}
          path: image-artifact

      - name: Load image tarball
        if: inputs.image_artifact != ''
        run: docker load -i image-artifact/image.tar

      # Probe jobs login+pull on a different runner; this job has no shared Docker state.
      # Trivy then hits GHCR unauthenticated (UNAUTHORIZED) unless we login here.
      - name: Log in to GHCR
        if: startsWith(inputs.image, 'ghcr.io/') && inputs.image_artifact == ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr_token || github.token }}

      - name: Pull GHCR image
        if: startsWith(inputs.image, 'ghcr.io/') && inputs.image_artifact == ''
        env:
          IMAGE: ${{ inputs.image }}
        run: docker pull "${IMAGE}"

      - name: Install tooling
        env:
          INSTALL_ONLY: trivy,syft,grype
        run: bash _containerdevops/scripts/install-container-tools.sh

      - name: Resolve vuln_fail_on_severity
        id: thr
        run: |
          set -euo pipefail
          FILE="_containerdevops/scripts/docker.profile.thresholds.yml"
          if [[ ! -f "$FILE" ]]; then
            echo "missing vendored thresholds at $FILE" >&2
            exit 1
          fi
          SEV="$(bash _containerdevops/scripts/read-thresholds.sh vuln_fail_on_severity "$FILE")"
          SEV_UP="$(printf '%s' "${SEV}" | tr '[:lower:]' '[:upper:]')"
          SEV_LO="$(printf '%s' "${SEV}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "sev_up=${SEV_UP}"
            echo "sev_lo=${SEV_LO}"
          } >> "$GITHUB_OUTPUT"

      - name: Trivy image scan
        id: trivy
        continue-on-error: true
        env:
          PKG_TYPES: ${{ inputs.pkg_types }}
          IMAGE: ${{ inputs.image }}
          IGNOREFILE: ${{ inputs.ignorefile }}
          SEV: ${{ steps.thr.outputs.sev_up }}
        run: |
          set -euo pipefail
          if [[ -z "${SEV}" ]]; then
            echo "empty vuln_fail_on_severity" >&2
            exit 1
          fi
          mkdir -p scan-results
          CFG=()
          [[ -f trivy.yaml ]] && CFG=(--config trivy.yaml)
          IGNORE=()
          if [[ "${IGNOREFILE}" == "none" ]]; then
            echo "ignorefile=none — skipping Trivy ignorefiles"
          elif [[ -n "${IGNOREFILE}" && -f "${IGNOREFILE}" ]]; then
            IGNORE=(--ignorefile "${IGNOREFILE}")
          elif [[ -n "${IGNOREFILE}" ]]; then
            echo "error: ignorefile path not found: ${IGNOREFILE}" >&2
            exit 1
          elif [[ -f .trivyignore.yaml ]]; then
            IGNORE=(--ignorefile .trivyignore.yaml)
          elif [[ -f .trivyignore ]]; then
            IGNORE=(--ignorefile .trivyignore)
          fi
          trivy image --scanners vuln --pkg-types "${PKG_TYPES}" \
            --severity "CRITICAL,${SEV}" \
            --format sarif --output scan-results/trivy.sarif \
            "${CFG[@]}" "${IGNORE[@]}" "${IMAGE}"
          trivy image --scanners vuln --pkg-types "${PKG_TYPES}" \
            --severity "CRITICAL,${SEV}" \
            --exit-code 1 "${CFG[@]}" "${IGNORE[@]}" "${IMAGE}"

      - name: Syft SBOM
        id: syft
        continue-on-error: true
        env:
          PKG_TYPES: ${{ inputs.pkg_types }}
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          mkdir -p scan-results
          SELECT=()
          if [[ "${PKG_TYPES}" == "library" ]]; then
            # Language catalogs, not python-only. Omit golang/binary so Grype
            # does not fail on vendor-static Go donors already in .trivyignore.yaml.
            SELECT=(--select-catalogers "python,javascript,java,dotnet,ruby,php,rust,dart,swift")
          fi
          syft "${IMAGE}" "${SELECT[@]}" \
            -o cyclonedx-json=scan-results/sbom.cdx.json \
            -o spdx-json=scan-results/sbom.spdx.json

      - name: Grype (SBOM)
        id: grype
        continue-on-error: true
        env:
          IMAGE: ${{ inputs.image }}
          SEV: ${{ steps.thr.outputs.sev_lo }}
        run: |
          set -euo pipefail
          if [[ -z "${SEV}" ]]; then
            echo "empty vuln_fail_on_severity" >&2
            exit 1
          fi
          CFG=()
          [[ -f .grype.yaml ]] && CFG=(--config .grype.yaml)
          if [[ -f scan-results/sbom.cdx.json ]]; then
            grype "sbom:scan-results/sbom.cdx.json" "${CFG[@]}" --fail-on "${SEV}" \
              -o json=scan-results/grype.json
          else
            grype "${IMAGE}" "${CFG[@]}" --fail-on "${SEV}" \
              -o json=scan-results/grype.json
          fi

      - name: Gate — scan
        if: always()
        env:
          ADVISORY: ${{ env.ADVISORY }}
          TRIVY: ${{ steps.trivy.outcome }}
          SYFT: ${{ steps.syft.outcome }}
          GRYPE: ${{ steps.grype.outcome }}
        run: |
          set -euo pipefail
          bash _containerdevops/scripts/gate-aggregate.sh \
            trivy="${TRIVY}" syft="${SYFT}" grype="${GRYPE}"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.results_artifact }}
          path: scan-results/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload Trivy SARIF
        if: always() && hashFiles('scan-results/trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: scan-results/trivy.sarif
          category: ${{ inputs.sarif_category }}
