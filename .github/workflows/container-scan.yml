name: Container Scan (reusable)

# Stays on the host runner: `docker pull` / a local tag needs the daemon.
# 6.0.0 dropped the image.tar artifact. A non-ghcr.io ref is a local tag
# already present on this runner (see container-build scan_local for the
# same-job path that does not push).

on:
  workflow_call:
    inputs:
      image:
        description: Image ref to scan (local tag or registry)
        required: true
        type: string
      scanners:
        description: Trivy --scanners (DOCKER-SEC-005 default includes secret)
        required: false
        type: string
        default: vuln,secret
      image_config_scanners:
        description: Trivy --image-config-scanners (misconfig,secret). Empty disables.
        required: false
        type: string
        default: misconfig,secret
      blocking:
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: "Commit/tag/branch of this repo to checkout for scripts (must match uses: pin)"
        required: false
        type: string
        default: ""
      pkg_types:
        description: Trivy --pkg-types (os,library or library for app-only / DHI OS noise)
        required: false
        type: string
        default: "os,library"
      ignorefile:
        description: "Trivy ignorefile path; empty falls back to .trivyignore.yaml/.trivyignore; set to 'none' to disable ignores"
        required: false
        type: string
        default: ""
      results_artifact:
        description: Upload artifact name for scan-results/ (unique when multiple scans share a run)
        required: false
        type: string
        default: container-scan-results
      sarif_category:
        description: Code scanning SARIF category (unique when multiple scans share a run)
        required: false
        type: string
        default: trivy-image
    secrets:
      scripts_token:
        description: Token to read this repo scripts when called cross-repo; defaults to github.token
        required: false
      ghcr_token:
        description: Optional PAT with read:packages when pulling a private GHCR image; defaults to github.token
        required: false
  workflow_dispatch:
    inputs:
      image:
        type: string
        required: true
      scanners:
        type: string
        default: vuln,secret
      image_config_scanners:
        type: string
        default: misconfig,secret
      blocking:
        type: boolean
        default: false
      scripts_ref:
        type: string
        default: ""
      pkg_types:
        type: string
        default: "os,library"
      ignorefile:
        type: string
        default: ""
      results_artifact:
        type: string
        default: container-scan-results
      sarif_category:
        type: string
        default: trivy-image

# CI-025
permissions: {}

# CI-002. See container-build.yml. results_artifact differs per variant.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}-{1}', github.workflow, github.ref) || format('call-{0}-{1}-{2}', github.workflow, github.run_id, inputs.results_artifact) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  scan:
    # CI-024: SARIF upload needs security-events
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout containerdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/containerdevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.scripts_token || github.token }}  # cross-repo: scripts_token; same-repo: github.token
          persist-credentials: false
          path: _containerdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Require image ref
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          if [[ -z "${IMAGE}" ]]; then
            echo "empty image ref — caller must compose ghcr.io/<owner>/<handoff_package>@<digest> (do not use image_ref: Actions strips it when DOCKERHUB_USERNAME equals the owner)" >&2
            exit 1
          fi

      - name: Log in to GHCR
        if: startsWith(inputs.image, 'ghcr.io/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr_token || github.token }}

      - name: Pull GHCR image
        if: startsWith(inputs.image, 'ghcr.io/')
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          if [[ -z "${IMAGE}" ]]; then
            echo "empty image ref — caller must compose ghcr.io/<owner>/<handoff_package>@<digest> (do not use image_ref: Actions strips it when DOCKERHUB_USERNAME equals the owner)" >&2
            exit 1
          fi
          docker pull "${IMAGE}"

      - name: Install tooling
        env:
          INSTALL_ONLY: trivy,syft,grype
        run: bash _containerdevops/scripts/install-container-tools.sh

      - name: Resolve vuln_fail_on_severity
        id: thr
        run: |
          set -euo pipefail
          FILE="_containerdevops/scripts/docker.profile.thresholds.yml"
          if [[ ! -f "$FILE" ]]; then
            echo "missing vendored thresholds at $FILE" >&2
            exit 1
          fi
          SEV="$(bash _containerdevops/scripts/read-thresholds.sh vuln_fail_on_severity "$FILE")"
          SEV_UP="$(printf '%s' "${SEV}" | tr '[:lower:]' '[:upper:]')"
          SEV_LO="$(printf '%s' "${SEV}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "sev_up=${SEV_UP}"
            echo "sev_lo=${SEV_LO}"
          } >> "$GITHUB_OUTPUT"

      - name: Trivy image scan
        id: trivy
        continue-on-error: true
        env:
          PKG_TYPES: ${{ inputs.pkg_types }}
          IMAGE: ${{ inputs.image }}
          IGNOREFILE: ${{ inputs.ignorefile }}
          SCANNERS: ${{ inputs.scanners }}
          IMAGE_CONFIG_SCANNERS: ${{ inputs.image_config_scanners }}
          SEV: ${{ steps.thr.outputs.sev_up }}
        run: |
          set -euo pipefail
          if [[ -z "${SEV}" ]]; then
            echo "empty vuln_fail_on_severity" >&2
            exit 1
          fi
          bash _containerdevops/scripts/scan-image.sh trivy

      - name: Syft SBOM
        id: syft
        continue-on-error: true
        env:
          PKG_TYPES: ${{ inputs.pkg_types }}
          IMAGE: ${{ inputs.image }}
        run: bash _containerdevops/scripts/scan-image.sh syft

      - name: Grype (SBOM)
        id: grype
        continue-on-error: true
        env:
          IMAGE: ${{ inputs.image }}
          SEV: ${{ steps.thr.outputs.sev_lo }}
        run: |
          set -euo pipefail
          if [[ -z "${SEV}" ]]; then
            echo "empty vuln_fail_on_severity" >&2
            exit 1
          fi
          bash _containerdevops/scripts/scan-image.sh grype

      - name: Gate — scan
        if: always()
        env:
          ADVISORY: ${{ env.ADVISORY }}
          TRIVY: ${{ steps.trivy.outcome }}
          SYFT: ${{ steps.syft.outcome }}
          GRYPE: ${{ steps.grype.outcome }}
        run: |
          set -euo pipefail
          bash _containerdevops/scripts/gate-aggregate.sh \
            trivy="${TRIVY}" syft="${SYFT}" grype="${GRYPE}"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.results_artifact }}
          path: scan-results/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload Trivy SARIF
        if: always() && hashFiles('scan-results/trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scan-results/trivy.sarif
          category: ${{ inputs.sarif_category }}
