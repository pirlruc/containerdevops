name: Container Scan (reusable)

# Stays on the host runner: image_artifact uses `docker load` (needs the daemon).
# ci-container has scanners but not a Docker socket — see handoff.

on:
  workflow_call:
    inputs:
      image:
        description: Image ref to scan (local tag or registry)
        required: true
        type: string
      image_artifact:
        description: Optional artifact name containing image.tar to load first
        required: false
        type: string
        default: ""
      blocking:
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: "Commit/tag/branch of this repo to checkout for scripts (must match uses: pin)"
        required: false
        type: string
        default: ""
      pkg_types:
        description: Trivy --pkg-types (os,library or library for app-only / DHI OS noise)
        required: false
        type: string
        default: "os,library"
    secrets:
      checkout_token:
        required: false
  workflow_dispatch:
    inputs:
      image:
        type: string
        required: true
      image_artifact:
        type: string
        default: ""
      blocking:
        type: boolean
        default: false
      scripts_ref:
        type: string
        default: ""
      pkg_types:
        type: string
        default: "os,library"

# CI-025
permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  scan:
    # CI-024: SARIF upload needs security-events
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout containerdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/containerdevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _containerdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Download image artifact
        if: inputs.image_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.image_artifact }}
          path: image-artifact

      - name: Load image tarball
        if: inputs.image_artifact != ''
        run: docker load -i image-artifact/image.tar

      - name: Install tooling
        env:
          INSTALL_ONLY: trivy,syft,grype
        run: bash _containerdevops/scripts/install-container-tools.sh

      - name: Trivy image scan
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          FILE="_containerdevops/scripts/docker.profile.thresholds.yml"
          [[ -f "$FILE" ]] || FILE="docs/guardrails/docker/profile.thresholds.yml"
          SEV="$(bash _containerdevops/scripts/read-thresholds.sh vuln_fail_on_severity "$FILE" | tr '[:lower:]' '[:upper:]')"
          mkdir -p scan-results
          CFG=()
          [[ -f trivy.yaml ]] && CFG=(--config trivy.yaml)
          trivy image --scanners vuln --pkg-types "${{ inputs.pkg_types }}" \
            --severity "CRITICAL,${SEV}" \
            --format sarif --output scan-results/trivy.sarif \
            "${CFG[@]}" "${{ inputs.image }}"
          trivy image --scanners vuln --pkg-types "${{ inputs.pkg_types }}" \
            --severity "CRITICAL,${SEV}" \
            --exit-code 1 "${CFG[@]}" "${{ inputs.image }}"

      - name: Syft SBOM
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          mkdir -p scan-results
          SELECT=()
          # Align SBOM with Trivy pkg_types=library (skip OS catalogers for DHI noise).
          if [[ "${{ inputs.pkg_types }}" == "library" ]]; then
            SELECT=(--select-catalogers python)
          fi
          syft "${{ inputs.image }}" "${SELECT[@]}" \
            -o cyclonedx-json=scan-results/sbom.cdx.json \
            -o spdx-json=scan-results/sbom.spdx.json

      - name: Grype (SBOM)
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          CFG=()
          [[ -f .grype.yaml ]] && CFG=(--config .grype.yaml)
          if [[ -f scan-results/sbom.cdx.json ]]; then
            grype "sbom:scan-results/sbom.cdx.json" "${CFG[@]}" --fail-on high \
              -o json=scan-results/grype.json
          else
            grype "${{ inputs.image }}" "${CFG[@]}" --fail-on high \
              -o json=scan-results/grype.json
          fi

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-scan-results
          path: scan-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Trivy SARIF
        if: always() && hashFiles('scan-results/trivy.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@ea14db8afdef5d462e69d78c4ca45002d4522418 # v4.37.4
        with:
          sarif_file: scan-results/trivy.sarif
          category: trivy-image
