name: Container Publish (reusable)

on:
  workflow_call:
    inputs:
      context:
        required: false
        type: string
        default: .
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      image_name:
        description: Unqualified image name (e.g. gitlab-mcp)
        required: true
        type: string
      github_owner:
        description: GHCR owner (defaults to github.repository_owner)
        required: false
        type: string
        default: ""
      dockerhub_image:
        description: Full Docker Hub image (namespace/name); empty skips Hub push
        required: false
        type: string
        default: ""
      platforms:
        required: false
        type: string
        default: linux/amd64,linux/arm64
      sign:
        description: Cosign + provenance (intended for public repos)
        required: false
        type: boolean
        default: false
      blocking:
        required: false
        type: boolean
        default: false
      dhi_login:
        description: Log in to dhi.io before build (needs DOCKERHUB_* secrets)
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: "Commit/tag/branch of this repo to checkout for scripts (must match uses: pin)"
        required: false
        type: string
        default: ""
      tag_latest:
        description: >-
          Also push the raw latest tag. Needed on release refs (tag refs are not
          branch refs). push/schedule/workflow_dispatch on main enable latest
          without this input.
        required: false
        type: boolean
        default: false
      verify_platforms:
        description: Run DOCKER-TEST-002 multi-arch verification after push
        required: false
        type: boolean
        default: true
      verify_command:
        description: Command run inside each platform image during multi-arch verify
        required: false
        type: string
        default: "/bin/true"
      structure_test_config:
        description: Optional CST config for per-platform verify (empty skips CST)
        required: false
        type: string
        default: ""
      build_args:
        description: Newline-separated Docker build-args (KEY=value)
        required: false
        type: string
        default: ""
      image_title:
        description: Override org.opencontainers.image.title (empty keeps metadata-action default)
        required: false
        type: string
        default: ""
      image_description:
        description: Override org.opencontainers.image.description (consumer-facing; max 512 chars)
        required: false
        type: string
        default: ""
      image_documentation:
        description: Override org.opencontainers.image.documentation URL
        required: false
        type: string
        default: ""
      image_url:
        description: Override org.opencontainers.image.url
        required: false
        type: string
        default: ""
      image_vendor:
        description: Override org.opencontainers.image.vendor
        required: false
        type: string
        default: ""
      dockerhub_readme:
        description: Path in the caller checkout to push as Docker Hub Overview (empty skips)
        required: false
        type: string
        default: ""
      dockerhub_short_description:
        description: Docker Hub short description (max 100 chars); used when dockerhub_readme is set
        required: false
        type: string
        default: ""
      tag_suffix:
        description: >-
          Suffix appended to every published tag (e.g. -alpine, -debian). Empty keeps
          legacy unsuffixed tags only.
        required: false
        type: string
        default: ""
      tag_alias_unsuffixed:
        description: >-
          When tag_suffix is set, also publish the unsuffixed tag set (version, latest, …)
          so the lower-vulnerability variant can own the default tags.
        required: false
        type: boolean
        default: true
      source_image:
        description: >-
          Scanned digest ref (ghcr.io/owner/name@sha256:…). When set, publish retags
          that digest instead of rebuilding. Empty keeps the Dockerfile rebuild path.
        required: false
        type: string
        default: ""
      rebuild:
        description: Force Dockerfile rebuild even when source_image is set
        required: false
        type: boolean
        default: false
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      scripts_token:
        description: Token to read this repo scripts when called cross-repo; defaults to github.token
        required: false
      ghcr_token:
        description: >-
          Optional packages:read token to prefetch private GHCR bases before push login.
          Prefer package Actions access so github.token can pull; otherwise pass a PAT.
        required: false
  # workflow_dispatch capped at 10 inputs (GitHub limit); full surface is workflow_call.
  workflow_dispatch:
    inputs:
      context:
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile
      image_name:
        type: string
        required: true
      dockerhub_image:
        type: string
        default: ""
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      sign:
        type: boolean
        default: false
      blocking:
        type: boolean
        default: false
      dhi_login:
        type: boolean
        default: false
      tag_latest:
        type: boolean
        default: false
      verify_platforms:
        type: boolean
        default: true

# CI-025
permissions: {}

# CI-002. tag_suffix differs per variant publish.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}-{1}', github.workflow, github.ref) || format('call-{0}-{1}-{2}', github.workflow, github.run_id, inputs.tag_suffix) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  ADVISORY: ${{ inputs.blocking == false }}
  # Enable `latest` on main for push/schedule/workflow_dispatch without an
  # explicit tag_latest. Release tag refs are not branch refs — callers pass
  # tag_latest there. Do not read default_branch from the event payload: that
  # field is empty on schedule, which would skip latest on monthly CI-027 rebuilds.
  PUBLISH_LATEST: ${{ inputs.tag_latest || (github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) }}

jobs:
  publish:
    # CI-024: publish/sign need registry secrets and id-token
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout containerdevops scripts
        if: inputs.sign || inputs.verify_platforms
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/containerdevops
          # github.workflow_sha is the *caller* workflow; pass scripts_ref matching uses: @pin.
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.scripts_token || github.token }}  # cross-repo: scripts_token; same-repo: github.token
          persist-credentials: false
          path: _containerdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Set up QEMU
        if: inputs.source_image == '' || inputs.rebuild
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to dhi.io
        if: inputs.dhi_login && github.event.pull_request.user.login != 'dependabot[bot]'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Pull private bases with optional packages:read PAT, then re-login with
      # github.token for packages:write push (read-only PAT cannot push).
      - name: Log in to GHCR (private base pull)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr_token || github.token }}

      - name: Prefetch CI_BASE from build_args
        if: inputs.source_image == '' || inputs.rebuild
        env:
          BUILD_ARGS: ${{ inputs.build_args }}
        run: |
          set -euo pipefail
          while IFS= read -r line || [[ -n "${line}" ]]; do
            [[ -z "${line}" || "${line}" =~ ^[[:space:]]*# ]] && continue
            [[ "${line}" == CI_BASE=* ]] || continue
            base="${line#CI_BASE=}"
            echo "Prefetching ${base}"
            docker pull "${base}"
          done <<< "${BUILD_ARGS}"

      - name: Log in to GHCR (push)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Docker Hub
        if: inputs.dockerhub_image != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Owner
        id: owner
        env:
          GITHUB_OWNER: ${{ inputs.github_owner }}
          OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ inputs.image_name }}
          DOCKERHUB_IMAGE: ${{ inputs.dockerhub_image }}
        run: |
          if [[ -n "${GITHUB_OWNER}" ]]; then OWNER="${GITHUB_OWNER}"; fi
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          {
            echo "images<<EOF"
            echo "ghcr.io/${OWNER}/${IMAGE_NAME}"
            if [[ -n "${DOCKERHUB_IMAGE}" ]]; then
              echo "${DOCKERHUB_IMAGE}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Index annotations need a multi-platform index; single-platform export
          # fails with "index annotations not supported for single platform export".
          DOCKER_METADATA_ANNOTATIONS_LEVELS: ${{ contains(inputs.platforms, ',') && 'index,manifest' || 'manifest' }}
        with:
          flavor: |
            latest=false
          images: ${{ steps.owner.outputs.images }}
          tags: |
            type=semver,pattern={{version}},suffix=${{ inputs.tag_suffix }}
            type=semver,pattern={{major}}.{{minor}},suffix=${{ inputs.tag_suffix }}
            type=sha,suffix=${{ inputs.tag_suffix }}
            type=raw,value=latest,suffix=${{ inputs.tag_suffix }},enable=${{ env.PUBLISH_LATEST }}
            type=raw,value={{date 'YYYYMMDD'}},suffix=${{ inputs.tag_suffix }},enable=${{ inputs.tag_latest }}
            type=semver,pattern={{version}},enable=${{ inputs.tag_suffix != '' && inputs.tag_alias_unsuffixed }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ inputs.tag_suffix != '' && inputs.tag_alias_unsuffixed }}
            type=sha,enable=${{ inputs.tag_suffix != '' && inputs.tag_alias_unsuffixed }}
            type=raw,value=latest,enable=${{ inputs.tag_suffix != '' && inputs.tag_alias_unsuffixed && env.PUBLISH_LATEST }}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ inputs.tag_suffix != '' && inputs.tag_alias_unsuffixed && inputs.tag_latest }}
          # DOCKER-DOC-001 — override repo-default title/description with image-specific values
          labels: |
            ${{ inputs.image_title != '' && format('org.opencontainers.image.title={0}', inputs.image_title) || '' }}
            ${{ inputs.image_description != '' && format('org.opencontainers.image.description={0}', inputs.image_description) || '' }}
            ${{ inputs.image_documentation != '' && format('org.opencontainers.image.documentation={0}', inputs.image_documentation) || '' }}
            ${{ inputs.image_url != '' && format('org.opencontainers.image.url={0}', inputs.image_url) || '' }}
            ${{ inputs.image_vendor != '' && format('org.opencontainers.image.vendor={0}', inputs.image_vendor) || '' }}
          annotations: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            ${{ inputs.image_title != '' && format('org.opencontainers.image.title={0}', inputs.image_title) || '' }}
            ${{ inputs.image_description != '' && format('org.opencontainers.image.description={0}', inputs.image_description) || '' }}
            ${{ inputs.image_documentation != '' && format('org.opencontainers.image.documentation={0}', inputs.image_documentation) || '' }}
            ${{ inputs.image_url != '' && format('org.opencontainers.image.url={0}', inputs.image_url) || '' }}
            ${{ inputs.image_vendor != '' && format('org.opencontainers.image.vendor={0}', inputs.image_vendor) || '' }}

      - name: Build and push
        id: rebuild
        if: inputs.source_image == '' || inputs.rebuild
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_RETENTION_DAYS: "1"
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          platforms: ${{ inputs.platforms }}
          # Registry attestations satisfy SC-PROV-001 on the Free plan.
          # actions/attest-build-provenance below stays gated on sign.
          provenance: mode=max
          sbom: true
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha,scope=publish-${{ inputs.image_name }}${{ inputs.tag_suffix }}
          cache-to: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && format('type=gha,mode=min,scope=publish-{0}{1}', inputs.image_name, inputs.tag_suffix) || '' }}

      - name: Retag scanned digest
        id: retag
        if: inputs.source_image != '' && inputs.rebuild == false
        env:
          SOURCE: ${{ inputs.source_image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [[ "${SOURCE}" != *@sha256:* ]]; then
            echo "source_image must be a digest ref (got ${SOURCE})" >&2
            exit 1
          fi
          digest="${SOURCE#*@}"
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            docker buildx imagetools create --tag "${tag}" "${SOURCE}"
          done <<< "${TAGS}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Record publish digest
        id: build
        env:
          REBUILD_DIGEST: ${{ steps.rebuild.outputs.digest }}
          RETAG_DIGEST: ${{ steps.retag.outputs.digest }}
          SOURCE: ${{ inputs.source_image }}
          REBUILD: ${{ inputs.rebuild }}
        run: |
          set -euo pipefail
          if [[ -n "${RETAG_DIGEST}" ]]; then
            echo "digest=${RETAG_DIGEST}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${REBUILD_DIGEST}" ]]; then
            echo "digest=${REBUILD_DIGEST}" >> "$GITHUB_OUTPUT"
          else
            echo "no publish digest" >&2
            exit 1
          fi

      - name: Docker Hub Overview
        # Only the variant that owns unsuffixed tags (or a legacy single-variant
        # publish with empty tag_suffix) should sync the Hub Overview — otherwise
        # parallel variant jobs race on the same description.
        if: >-
          inputs.dockerhub_image != '' &&
          inputs.dockerhub_readme != '' &&
          (inputs.tag_suffix == '' || inputs.tag_alias_unsuffixed)
        # Always advisory: Hub description API needs admin (read/write/delete) token
        # scope; a push-only PAT returns Forbidden and must not fail the image publish.
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ inputs.dockerhub_image }}
          readme-filepath: ${{ inputs.dockerhub_readme }}
          short-description: ${{ inputs.dockerhub_short_description }}

      - name: Install verify tooling
        if: inputs.verify_platforms || inputs.sign
        env:
          INSTALL_ONLY: cosign,container-structure-test
        run: bash _containerdevops/scripts/install-container-tools.sh

      - name: Verify multi-arch (DOCKER-TEST-002)
        if: inputs.verify_platforms
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          OWNER: ${{ steps.owner.outputs.owner }}
          IMAGE_NAME: ${{ inputs.image_name }}
          PLATFORMS: ${{ inputs.platforms }}
          VERIFY_COMMAND: ${{ inputs.verify_command }}
          STRUCTURE_TEST_CONFIG: ${{ inputs.structure_test_config }}
        run: |
          digest="${IMAGE_DIGEST}"
          subject="ghcr.io/${OWNER}/${IMAGE_NAME}@${digest}"
          bash _containerdevops/scripts/verify-multiarch.sh \
            "${subject}" \
            "${PLATFORMS}" \
            "${VERIFY_COMMAND}" \
            "${STRUCTURE_TEST_CONFIG}"

      - name: Cosign sign (keyless)
        if: inputs.sign && github.event.pull_request.user.login != 'dependabot[bot]'
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        env:
          COSIGN_YES: "true"
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          digest="${IMAGE_DIGEST}"
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            cosign sign --yes "${tag}@${digest}"
          done <<< "${META_TAGS}"

      - name: Attest provenance
        if: inputs.sign && github.event.pull_request.user.login != 'dependabot[bot]'
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.owner }}/${{ inputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
