name: Container Publish (reusable)

on:
  workflow_call:
    inputs:
      context:
        required: false
        type: string
        default: .
      dockerfile:
        required: false
        type: string
        default: Dockerfile
      image_name:
        description: Unqualified image name (e.g. gitlab-mcp)
        required: true
        type: string
      github_owner:
        description: GHCR owner (defaults to github.repository_owner)
        required: false
        type: string
        default: ""
      dockerhub_image:
        description: Full Docker Hub image (namespace/name); empty skips Hub push
        required: false
        type: string
        default: ""
      platforms:
        required: false
        type: string
        default: linux/amd64,linux/arm64
      sign:
        description: Cosign + provenance (intended for public repos)
        required: false
        type: boolean
        default: false
      blocking:
        required: false
        type: boolean
        default: false
      dhi_login:
        description: Log in to dhi.io before build (needs DOCKERHUB_* secrets)
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: "Commit/tag/branch of this repo to checkout for scripts (must match uses: pin)"
        required: false
        type: string
        default: ""
      tag_latest:
        description: Also push the raw latest tag (needed on release refs where is_default_branch is false)
        required: false
        type: boolean
        default: false
      verify_platforms:
        description: Run DOCKER-TEST-002 multi-arch verification after push
        required: false
        type: boolean
        default: true
      verify_command:
        description: Command run inside each platform image during multi-arch verify
        required: false
        type: string
        default: "/bin/true"
      structure_test_config:
        description: Optional CST config for per-platform verify (empty skips CST)
        required: false
        type: string
        default: ""
      build_args:
        description: Newline-separated Docker build-args (KEY=value)
        required: false
        type: string
        default: ""
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      # Required when the caller is a different private repo (see container-lint.yml).
      checkout_token:
        required: false
  # workflow_dispatch capped at 10 inputs (GitHub limit); full surface is workflow_call.
  workflow_dispatch:
    inputs:
      context:
        type: string
        default: .
      dockerfile:
        type: string
        default: Dockerfile
      image_name:
        type: string
        required: true
      dockerhub_image:
        type: string
        default: ""
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      sign:
        type: boolean
        default: false
      blocking:
        type: boolean
        default: false
      dhi_login:
        type: boolean
        default: false
      tag_latest:
        type: boolean
        default: false
      verify_platforms:
        type: boolean
        default: true

# CI-025
permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  publish:
    # CI-024: publish/sign need registry secrets and id-token
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout containerdevops scripts
        if: inputs.sign || inputs.verify_platforms
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/containerdevops
          # github.workflow_sha is the *caller* workflow; pass scripts_ref matching uses: @pin.
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _containerdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to dhi.io
        if: inputs.dhi_login && github.actor != 'dependabot[bot]'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: inputs.dockerhub_image != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Owner
        id: owner
        run: |
          OWNER="${{ inputs.github_owner }}"
          if [[ -z "${OWNER}" ]]; then OWNER="${{ github.repository_owner }}"; fi
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          {
            echo "images<<EOF"
            echo "ghcr.io/${OWNER}/${{ inputs.image_name }}"
            if [[ -n "${{ inputs.dockerhub_image }}" ]]; then
              echo "${{ inputs.dockerhub_image }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.owner.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ inputs.tag_latest || (github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
            type=raw,value={{date 'YYYYMMDD'}},enable=${{ inputs.tag_latest }}

      - name: Build and push
        id: build
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # DOCKER-DOC-001 — metadata-action labels + explicit OCI annotations
          annotations: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          platforms: ${{ inputs.platforms }}
          provenance: false
          sbom: false
          build-args: ${{ inputs.build_args }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install verify tooling
        if: inputs.verify_platforms || inputs.sign
        env:
          INSTALL_ONLY: cosign,container-structure-test
        run: bash _containerdevops/scripts/install-container-tools.sh

      - name: Verify multi-arch (DOCKER-TEST-002)
        if: inputs.verify_platforms
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          digest="${{ steps.build.outputs.digest }}"
          subject="ghcr.io/${{ steps.owner.outputs.owner }}/${{ inputs.image_name }}@${digest}"
          bash _containerdevops/scripts/verify-multiarch.sh \
            "${subject}" \
            "${{ inputs.platforms }}" \
            "${{ inputs.verify_command }}" \
            "${{ inputs.structure_test_config }}"

      - name: Cosign sign (keyless)
        if: inputs.sign && github.actor != 'dependabot[bot]'
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        env:
          COSIGN_YES: "true"
        run: |
          digest="${{ steps.build.outputs.digest }}"
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            cosign sign --yes "${tag}@${digest}"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Attest provenance
        if: inputs.sign && github.actor != 'dependabot[bot]'
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.owner }}/${{ inputs.image_name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
