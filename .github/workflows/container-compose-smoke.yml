name: Container Compose Smoke (reusable)

# CDO-SMOKE-001. Boots a caller stack with docker compose up --wait, then
# always removes the project. Heavy stacks stay opt-in: callers choose when
# to call this workflow. container-iac still validates config and KICS.

on:
  workflow_call:
    inputs:
      compose_files:
        description: Space-separated compose files
        required: true
        type: string
      env_files:
        description: Space-separated env files passed to docker compose --env-file
        required: false
        type: string
        default: ""
      project_name:
        description: Compose project name
        required: false
        type: string
        default: ""
      blocking:
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: "Commit/tag/branch of this repo to checkout for scripts (must match uses: pin)"
        required: false
        type: string
        default: ""
    secrets:
      scripts_token:
        description: Token to read this repo scripts when called cross-repo; defaults to github.token
        required: false
  workflow_dispatch:
    inputs:
      compose_files:
        type: string
        default: ""
      env_files:
        type: string
        default: ""
      project_name:
        type: string
        default: ""
      blocking:
        type: boolean
        default: false
      scripts_ref:
        type: string
        default: ""

permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('dispatch-{0}-{1}', github.workflow, github.ref) || format('call-{0}-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  smoke:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout containerdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/containerdevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.scripts_token || github.token }}
          persist-credentials: false
          path: _containerdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Require scripts_ref for cross-repo callers (CI-034)
        env:
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${REPO}" != "pirlruc/containerdevops" && -z "${SCRIPTS_REF}" ]]; then
            echo "CI-034: cross-repo callers must pass scripts_ref matching the uses: pin" >&2
            exit 1
          fi

      - name: Compose smoke
        id: smoke
        continue-on-error: true
        env:
          COMPOSE_FILES: ${{ inputs.compose_files }}
          COMPOSE_ENV_FILES: ${{ inputs.env_files }}
          COMPOSE_PROJECT: ${{ inputs.project_name != '' && inputs.project_name || format('compose-smoke-{0}', github.run_id) }}
        run: bash _containerdevops/scripts/compose-smoke.sh

      - name: Gate — smoke
        if: always()
        env:
          ADVISORY: ${{ env.ADVISORY }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          set -euo pipefail
          bash _containerdevops/scripts/gate-aggregate.sh "smoke=${SMOKE}"
