name: Containerdevops Security (scheduled)

# Time-varying gates: secrets/SAST, image rescan, KICS, Scorecard-adjacent supply chain.
# Deterministic lint stays on push/PR (containerdevops-ci.yml).

on:
  schedule:
    # Weekly Tuesday 06:17 UTC
    - cron: "17 6 * * 2"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail jobs on gate errors
        type: boolean
        default: false

concurrency:
  group: containerdevops-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  secrets-sast:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@e41270c45b858cfa7a9f8404eaee781b5c29b61c
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: e41270c45b858cfa7a9f8404eaee781b5c29b61c
      container_image: ghcr.io/pirlruc/ci-lint@sha256:f9001c4c8726f72107545094237d4fc0592baca023cfa299a532634666d88111
  supply-chain:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@e41270c45b858cfa7a9f8404eaee781b5c29b61c
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: e41270c45b858cfa7a9f8404eaee781b5c29b61c
      container_image: ghcr.io/pirlruc/ci-supply-chain@sha256:dc83deb4465d5989a03b14ccabef46c3f3426231048b962c69b8e434a7200d48
  scorecard:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.repository.fork == false
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: pirlruc/commondevops/.github/workflows/common-scorecard.yml@e41270c45b858cfa7a9f8404eaee781b5c29b61c
    with:
      blocking: false
      publish_results: false
    secrets:
      repo_token: ${{ secrets.SCORECARD_TOKEN }}

  token-audit:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions: {}
    uses: pirlruc/commondevops/.github/workflows/common-token-audit.yml@e41270c45b858cfa7a9f8404eaee781b5c29b61c
    with:
      scripts_ref: e41270c45b858cfa7a9f8404eaee781b5c29b61c
    secrets:
      guardrails_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  iac:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/container-iac.yml
    with:
      paths: .
      scripts_ref: ${{ github.sha }}
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}

  # The published tag is the last release. A pull request cannot change it, so
  # the rescan stays on schedule and dispatch. 6.4.0 replaces this digest.
  published-image-rescan:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: ./.github/workflows/container-published-rescan.yml
    with:
      image: ghcr.io/pirlruc/ci-container:6.3.0@sha256:b70472adbfb4a25d61bf92e7a3d957af17525872be5a17d8cc171c003e70e106
      scripts_ref: ${{ github.sha }}
      pkg_types: library
      ignorefile: docker/ci-container/.trivyignore.yaml
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}

  # CI-044: one check that is not path-filtered. Security jobs above have no paths.
  security-aggregate:
    if: always()
    needs: [secrets-sast, supply-chain, scorecard, token-audit, iac, published-image-rescan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail when a security job failed
        env:
          SECRETS: ${{ needs.secrets-sast.result }}
          SUPPLY: ${{ needs.supply-chain.result }}
          SCORE: ${{ needs.scorecard.result }}
          TOKEN: ${{ needs.token-audit.result }}
          IAC: ${{ needs.iac.result }}
          RESCAN: ${{ needs.published-image-rescan.result }}
        run: |
          set -eu
          failed=""
          for item in "secrets-sast=${SECRETS}" "supply-chain=${SUPPLY}" "scorecard=${SCORE}" "token-audit=${TOKEN}" "iac=${IAC}" "rescan=${RESCAN}"; do
            name=${item%%=*}
            result=${item#*=}
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              failed="${failed} ${name}(${result})"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "::error::Security jobs failed:${failed}"
            exit 1
          fi
          echo "Security aggregate passed."
