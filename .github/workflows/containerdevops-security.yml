name: Containerdevops Security (scheduled)

# Time-varying gates: secrets/SAST, image rescan, KICS, Scorecard-adjacent supply chain.
# Deterministic lint stays on push/PR (containerdevops-ci.yml).

on:
  schedule:
    # Weekly Tuesday 06:17 UTC
    - cron: "17 6 * * 2"
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail jobs on gate errors
        type: boolean
        default: false

concurrency:
  group: containerdevops-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  secrets-sast:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@bcddb5db4ba5d291aa7f434d447e43175f14136c
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: bcddb5db4ba5d291aa7f434d447e43175f14136c
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  supply-chain:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@bcddb5db4ba5d291aa7f434d447e43175f14136c
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: bcddb5db4ba5d291aa7f434d447e43175f14136c
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  iac:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/container-iac.yml
    with:
      paths: .
      scripts_ref: ${{ github.sha }}
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}

  published-image-rescan:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
      packages: read
    uses: ./.github/workflows/container-published-rescan.yml
    with:
      image: ghcr.io/pirlruc/ci-container:3.0.0@sha256:9374acb5caed2cf9482a86eb9689a76d7afb3ac2bb1f97973c1a2a423c137365
      scripts_ref: ${{ github.sha }}
      pkg_types: library
      ignorefile: docker/ci-container/.trivyignore.yaml
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
