name: Containerdevops Security (scheduled)

# Time-varying gates: secrets/SAST, image rescan, KICS, Scorecard-adjacent supply chain.
# Deterministic lint stays on push/PR (containerdevops-ci.yml).

on:
  schedule:
    # Weekly Tuesday 06:17 UTC
    - cron: "17 6 * * 2"
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail jobs on gate errors
        type: boolean
        default: false

concurrency:
  group: containerdevops-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  secrets-sast:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@1.0.0
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: 1.0.0
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  supply-chain:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@1.0.0
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: 1.0.0
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  iac:
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/container-iac.yml
    with:
      paths: .
      scripts_ref: ${{ github.sha }}
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  published-image-probe:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      present: ${{ steps.probe.outputs.present }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: probe
        run: |
          if docker pull ghcr.io/pirlruc/ci-container:latest; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ci-container:latest not pullable yet; rescan will skip"
          fi

  published-image-rescan:
    needs: published-image-probe
    if: github.actor != 'dependabot[bot]' && needs.published-image-probe.outputs.present == 'true'
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/container-scan.yml
    with:
      image: ghcr.io/pirlruc/ci-container:latest
      scripts_ref: ${{ github.sha }}
      pkg_types: library
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
    secrets:
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}
