name: Containerdevops Security (scheduled)

# Time-varying gates: secrets/SAST, image rescan, KICS, Scorecard-adjacent supply chain.
# Deterministic lint stays on push/PR (containerdevops-ci.yml).

on:
  schedule:
    # Weekly Tuesday 06:17 UTC
    - cron: "17 6 * * 2"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail jobs on gate errors
        type: boolean
        default: false

concurrency:
  group: containerdevops-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  secrets-sast:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@1c621c43fa1bee2613ab4996135f85d0c55d59fb
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: 1c621c43fa1bee2613ab4996135f85d0c55d59fb
      container_image: ghcr.io/pirlruc/ci-lint@sha256:e0f48be58460a9eeb3adcc8c7c4c3592db0318dbe4de9c90c1b4b9e863898f6c
  supply-chain:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@1c621c43fa1bee2613ab4996135f85d0c55d59fb
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: 1c621c43fa1bee2613ab4996135f85d0c55d59fb
      container_image: ghcr.io/pirlruc/ci-supply-chain@sha256:dc83deb4465d5989a03b14ccabef46c3f3426231048b962c69b8e434a7200d48
  scorecard:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.repository.fork == false
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: pirlruc/commondevops/.github/workflows/common-scorecard.yml@1c621c43fa1bee2613ab4996135f85d0c55d59fb
    with:
      blocking: false
      publish_results: false
    secrets:
      repo_token: ${{ secrets.SCORECARD_TOKEN }}

  token-audit:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions: {}
    uses: pirlruc/commondevops/.github/workflows/common-token-audit.yml@1c621c43fa1bee2613ab4996135f85d0c55d59fb
    with:
      scripts_ref: 1c621c43fa1bee2613ab4996135f85d0c55d59fb
    secrets:
      guardrails_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  iac:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/container-iac.yml
    with:
      paths: .
      scripts_ref: ${{ github.sha }}
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}

  # The published tag is the last release. A pull request cannot change it, so
  # the rescan stays on schedule and dispatch. 6.7.0 Alpine linux/amd64.
  # The unsuffixed tag and 6.7.0-alpine share this manifest.
  published-image-rescan:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: ./.github/workflows/container-published-rescan.yml
    with:
      image: ghcr.io/pirlruc/ci-container:6.7.0@sha256:9568af6b2726a525fd623caf391cec1aa0541e5ee4db10079e10182c40ac4fa1
      scripts_ref: ${{ github.sha }}
      pkg_types: library
      ignorefile: docker/ci-container/.trivyignore.yaml
      sarif_category: trivy-image
      results_artifact: published-ci-container-alpine
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}

  # Advisory OS scan. Same category the image workflow uploads, so a
  # default-branch run closes the alerts that a tag upload cannot.
  published-posture-alpine:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: ./.github/workflows/container-published-rescan.yml
    with:
      image: ghcr.io/pirlruc/ci-container:6.7.0@sha256:9568af6b2726a525fd623caf391cec1aa0541e5ee4db10079e10182c40ac4fa1
      scripts_ref: ${{ github.sha }}
      pkg_types: os,library
      ignorefile: none
      sarif_category: trivy-posture-alpine
      results_artifact: published-posture-alpine
      blocking: false

  published-posture-debian:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: ./.github/workflows/container-published-rescan.yml
    with:
      image: ghcr.io/pirlruc/ci-container:6.7.0-debian@sha256:dd689a89e39bc7dd033644771dbde06429a97ceedaa939da7a5eea06175ea6e6
      scripts_ref: ${{ github.sha }}
      pkg_types: os,library
      ignorefile: none
      sarif_category: trivy-posture-debian
      results_artifact: published-posture-debian
      blocking: false

  # CI-044: one check that is not path-filtered. Security jobs above have no paths.
  security-aggregate:
    if: always()
    needs: [secrets-sast, supply-chain, scorecard, token-audit, iac, published-image-rescan, published-posture-alpine, published-posture-debian]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail when a security job failed
        env:
          SECRETS: ${{ needs.secrets-sast.result }}
          SUPPLY: ${{ needs.supply-chain.result }}
          SCORE: ${{ needs.scorecard.result }}
          TOKEN: ${{ needs.token-audit.result }}
          IAC: ${{ needs.iac.result }}
          RESCAN: ${{ needs.published-image-rescan.result }}
          POSTURE_ALPINE: ${{ needs.published-posture-alpine.result }}
          POSTURE_DEBIAN: ${{ needs.published-posture-debian.result }}
        run: |
          set -eu
          failed=""
          for item in "secrets-sast=${SECRETS}" "supply-chain=${SUPPLY}" "scorecard=${SCORE}" "token-audit=${TOKEN}" "iac=${IAC}" "rescan=${RESCAN}" "posture-alpine=${POSTURE_ALPINE}" "posture-debian=${POSTURE_DEBIAN}"; do
            name=${item%%=*}
            result=${item#*=}
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              failed="${failed} ${name}(${result})"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "::error::Security jobs failed:${failed}"
            exit 1
          fi
          echo "Security aggregate passed."
