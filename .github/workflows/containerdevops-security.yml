name: Containerdevops Security (scheduled)

# Time-varying gates: secrets/SAST, image rescan, KICS, Scorecard-adjacent supply chain.
# Deterministic lint stays on push/PR (containerdevops-ci.yml).

on:
  schedule:
    # Weekly Tuesday 06:17 UTC
    - cron: "17 6 * * 2"
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      blocking:
        description: Fail jobs on gate errors
        type: boolean
        default: false

concurrency:
  group: containerdevops-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  secrets-sast:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      packages: read
    uses: pirlruc/commondevops/.github/workflows/common-secrets-sast.yml@a2af891c6d05fe2790bc5ddf761252c95185ce5f
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: a2af891c6d05fe2790bc5ddf761252c95185ce5f
      container_image: ghcr.io/pirlruc/ci-lint@sha256:3ed6d8dcbb08abf82e563630f2c1218cf0e8f33bb883ed46770e147113af48b0
  supply-chain:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    uses: pirlruc/commondevops/.github/workflows/common-supply-chain.yml@a2af891c6d05fe2790bc5ddf761252c95185ce5f
    with:
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}
      working_directory: .
      scripts_ref: a2af891c6d05fe2790bc5ddf761252c95185ce5f
      container_image: ghcr.io/pirlruc/ci-supply-chain@sha256:cceea28e7719138294d11396fa3b9ebdb078d5997de6b4454b9e3f14e33d5133
  scorecard:
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.repository.fork == false
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    uses: pirlruc/commondevops/.github/workflows/common-scorecard.yml@a2af891c6d05fe2790bc5ddf761252c95185ce5f
    with:
      blocking: false
      publish_results: false
    secrets:
      repo_token: ${{ secrets.SCORECARD_TOKEN }}

  token-audit:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions: {}
    uses: pirlruc/commondevops/.github/workflows/common-token-audit.yml@a2af891c6d05fe2790bc5ddf761252c95185ce5f
    with:
      scripts_ref: a2af891c6d05fe2790bc5ddf761252c95185ce5f
    secrets:
      guardrails_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}
      checkout_token: ${{ secrets.COMMONDEVOPS_READ_TOKEN }}

  iac:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/container-iac.yml
    with:
      paths: .
      scripts_ref: ${{ github.sha }}
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}

  # The published tag is the last release. A pull request cannot change it, so
  # the rescan stays on schedule and dispatch. Categories match ci-container-image.yml
  # so a default-branch upload can close the release alerts. 6.8.0 Alpine linux/amd64.
  # The unsuffixed tag and 6.8.0-alpine share this manifest.
  published-image-rescan:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: ./.github/workflows/container-published-rescan.yml
    with:
      image: ghcr.io/pirlruc/ci-container:6.8.0@sha256:80940e1e17a71884052ce3b4859c3c1741e554b5087df1864a89c10a00312264
      scripts_ref: ${{ github.sha }}
      pkg_types: library
      ignorefile: docker/ci-container/.trivyignore.yaml
      sarif_category: trivy-image-alpine
      results_artifact: published-ci-container-alpine
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}

  published-image-rescan-debian:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: ./.github/workflows/container-published-rescan.yml
    with:
      image: ghcr.io/pirlruc/ci-container:6.8.0-debian@sha256:b1910e253e5941d25158a21a4283006f056ec7b8a4a7b539581d10d110458dd0
      scripts_ref: ${{ github.sha }}
      pkg_types: library
      ignorefile: docker/ci-container/.trivyignore.yaml
      sarif_category: trivy-image-debian
      results_artifact: published-ci-container-debian
      blocking: ${{ github.event_name != 'workflow_dispatch' || inputs.blocking }}

  # Advisory OS scan. Same category the image workflow uploads, so a
  # default-branch run closes the alerts that a tag upload cannot.
  published-posture-alpine:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: ./.github/workflows/container-published-rescan.yml
    with:
      image: ghcr.io/pirlruc/ci-container:6.8.0@sha256:80940e1e17a71884052ce3b4859c3c1741e554b5087df1864a89c10a00312264
      scripts_ref: ${{ github.sha }}
      pkg_types: os,library
      ignorefile: none
      sarif_category: trivy-posture-alpine
      results_artifact: published-posture-alpine
      blocking: false

  published-posture-debian:
    if: github.event_name != 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      actions: read
      security-events: write
      packages: read
    uses: ./.github/workflows/container-published-rescan.yml
    with:
      image: ghcr.io/pirlruc/ci-container:6.8.0-debian@sha256:b1910e253e5941d25158a21a4283006f056ec7b8a4a7b539581d10d110458dd0
      scripts_ref: ${{ github.sha }}
      pkg_types: os,library
      ignorefile: none
      sarif_category: trivy-posture-debian
      results_artifact: published-posture-debian
      blocking: false

  # CI-044: one check that is not path-filtered. Security jobs above have no paths.
  security-aggregate:
    if: always()
    needs: [secrets-sast, supply-chain, scorecard, token-audit, iac, published-image-rescan, published-image-rescan-debian, published-posture-alpine, published-posture-debian]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail when a security job failed
        env:
          SECRETS: ${{ needs.secrets-sast.result }}
          SUPPLY: ${{ needs.supply-chain.result }}
          SCORE: ${{ needs.scorecard.result }}
          TOKEN: ${{ needs.token-audit.result }}
          IAC: ${{ needs.iac.result }}
          RESCAN: ${{ needs.published-image-rescan.result }}
          POSTURE_ALPINE: ${{ needs.published-posture-alpine.result }}
          POSTURE_DEBIAN: ${{ needs.published-posture-debian.result }}
        run: |
          set -eu
          failed=""
          for item in "secrets-sast=${SECRETS}" "supply-chain=${SUPPLY}" "scorecard=${SCORE}" "token-audit=${TOKEN}" "iac=${IAC}" "rescan=${RESCAN}" "posture-alpine=${POSTURE_ALPINE}" "posture-debian=${POSTURE_DEBIAN}"; do
            name=${item%%=*}
            result=${item#*=}
            if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
              failed="${failed} ${name}(${result})"
            fi
          done
          if [ -n "${failed}" ]; then
            echo "::error::Security jobs failed:${failed}"
            exit 1
          fi
          echo "Security aggregate passed."
