# Push the ci-container Docker Hub Overview without rebuilding the image.
# This file owns the push trigger. The reusable workflow does not, because a
# called workflow still sees the caller's event name.

name: Hub description

on:
  push:
    branches: [main]
    paths:
      - "docs/docker-hub*.md"
      - ".github/workflows/hub-description.yml"
      - ".github/workflows/container-hub-description.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hub-description-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-container:
    permissions:
      contents: read
    uses: ./.github/workflows/container-hub-description.yml
    with:
      dockerhub_image: pirlruc/ci-container
      dockerhub_readme: docs/docker-hub.md
      dockerhub_short_description: >-
        CI toolchain: ci-lint plus dive and container-structure-test
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_DESCRIPTION_TOKEN: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN }}
