name: Artifact sweep (container-image*, build records, stale caches)

# Caller for the commondevops sweep. The job runs in this repository.

on:
  schedule:
    - cron: "12 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: artifact-sweep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    permissions:
      actions: write
    uses: pirlruc/commondevops/.github/workflows/artifact-sweep.yml@1c621c43fa1bee2613ab4996135f85d0c55d59fb
