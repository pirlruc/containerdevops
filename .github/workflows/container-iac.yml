name: Container IaC (reusable)

on:
  workflow_call:
    inputs:
      paths:
        description: Comma-separated paths for KICS (-p)
        required: false
        type: string
        default: .
      exclude_paths:
        description: Comma-separated KICS exclude paths
        required: false
        type: string
        default: ""
      compose_files:
        description: Space-separated compose files for docker compose config
        required: false
        type: string
        default: ""
      kics_config:
        required: false
        type: string
        default: .github/kics.config
      blocking:
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: "Commit/tag/branch of this repo to checkout for scripts (must match uses: pin)"
        required: false
        type: string
        default: ""
    secrets:
      scripts_token:
        description: Token to read this repo scripts when called cross-repo; defaults to github.token
        required: false
  workflow_dispatch:
    inputs:
      paths:
        type: string
        default: .
      exclude_paths:
        type: string
        default: ""
      compose_files:
        type: string
        default: ""
      kics_config:
        type: string
        default: .github/kics.config
      blocking:
        type: boolean
        default: false
      scripts_ref:
        type: string
        default: ""

# CI-025
permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}
  # checkmarx/kics:v2.1.20-debian linux/amd64 (CI-026). Re-confirmed 2026-09-11:
  # Hub has no v2.1.21 image (GitHub release 2026-07-30). Index digest is
  # sha256:b29ec62a…; this pin is the linux/amd64 manifest (matches --platform).
  KICS_IMAGE: checkmarx/kics@sha256:aaf7bd6147f45b3717d4868be71d1c5ab2dceefbe9a2f95d3980d1ce8be6655a

jobs:
  iac:
    # CI-024: SARIF upload
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout containerdevops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/containerdevops
          # github.workflow_sha is the *caller* workflow; pass scripts_ref matching uses: @pin.
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.scripts_token || github.token }}  # cross-repo: scripts_token; same-repo: github.token
          persist-credentials: false
          path: _containerdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Resolve iac_fail_on
        id: thr
        run: |
          FILE="_containerdevops/scripts/docker.profile.thresholds.yml"
          [[ -f "$FILE" ]] || FILE="docs/guardrails/docker/profile.thresholds.yml"
          echo "fail_on=$(bash _containerdevops/scripts/read-thresholds.sh iac_fail_on "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Pull KICS (digest-pinned)
        run: docker pull "${KICS_IMAGE}"

      - name: KICS scan
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        env:
          KICS_PATHS: ${{ inputs.paths }}
          KICS_EXCLUDE: ${{ inputs.exclude_paths }}
          KICS_CONFIG: ${{ inputs.kics_config }}
          FAIL_ON: ${{ steps.thr.outputs.fail_on }}
        run: |
          mkdir -p kics-results
          PATHS="${KICS_PATHS}"
          EXCL="${KICS_EXCLUDE}"
          CFG="${KICS_CONFIG}"
          ARGS=(-p)
          IFS=',' read -ra P <<< "${PATHS}"
          for p in "${P[@]}"; do
            ARGS+=("/src/${p#/}")
          done
          EXTRA=()
          if [[ -n "${EXCL}" ]]; then
            EXTRA+=(-e)
            IFS=',' read -ra E <<< "${EXCL}"
            for e in "${E[@]}"; do
              EXTRA+=("/src/${e#/}")
            done
          fi
          CONFIG_ARGS=()
          [[ -f "${CFG}" ]] && CONFIG_ARGS=(--config "/src/${CFG}")
          docker run --rm --platform linux/amd64 \
            -v "${GITHUB_WORKSPACE}:/src:ro" \
            -v "${GITHUB_WORKSPACE}/kics-results:/reports" \
            "${KICS_IMAGE}" \
            /app/bin/kics scan \
              "${ARGS[@]}" \
              "${EXTRA[@]}" \
              -o /reports \
              "${CONFIG_ARGS[@]}" \
              --report-formats sarif,json \
              --fail-on "${FAIL_ON}" \
              --no-progress

      - name: Compose config
        if: inputs.compose_files != ''
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        env:
          COMPOSE_FILES: ${{ inputs.compose_files }}
        run: |
          # shellcheck disable=SC2086
          for f in $COMPOSE_FILES; do
            echo "Validating ${f}"
            docker compose -f "${f}" config --quiet
          done

      - name: Upload KICS results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kics-results
          path: kics-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload KICS SARIF
        if: always() && hashFiles('kics-results/results.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: kics-results/results.sarif
          category: kics
