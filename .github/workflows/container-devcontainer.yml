name: Container Devcontainer (reusable)

# CDO-006: lint + light structure verification for .devcontainer/Dockerfile.
# Full image build remains optional (Actions minutes); structure-test stub when config present.

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Path to devcontainer Dockerfile
        required: false
        type: string
        default: .devcontainer/Dockerfile
      working_directory:
        required: false
        type: string
        default: .
      structure_test_config:
        description: Optional container-structure-test config (empty skips)
        required: false
        type: string
        default: ""
      blocking:
        required: false
        type: boolean
        default: false
      scripts_ref:
        required: false
        type: string
        default: ""
    secrets:
      checkout_token:
        required: false
  workflow_dispatch:
    inputs:
      dockerfile:
        type: string
        default: .devcontainer/Dockerfile
      working_directory:
        type: string
        default: .
      blocking:
        type: boolean
        default: false

# CI-025
permissions: {}

env:
  ADVISORY: ${{ inputs.blocking == false }}

jobs:
  devcontainer:
    runs-on: ubuntu-24.04
    # Prefer :local until ghcr.io/pirlruc/ci-container is published.
    container: ghcr.io/pirlruc/ci-container:latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout containerdevops scripts
        if: github.actor != 'dependabot[bot]'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/containerdevops
          ref: ${{ inputs.scripts_ref || github.sha }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: _containerdevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Require Dockerfile
        run: |
          if [[ ! -f "${{ inputs.dockerfile }}" ]]; then
            echo "No ${{ inputs.dockerfile }} — nothing to verify"
            exit 0
          fi

      - name: Resolve hadolint threshold
        id: thr
        working-directory: ${{ github.workspace }}
        run: |
          FILE="_containerdevops/scripts/docker.profile.thresholds.yml"
          [[ -f "$FILE" ]] || FILE="docs/guardrails/docker/profile.thresholds.yml"
          echo "hadolint=$(bash _containerdevops/scripts/read-thresholds.sh hadolint_failure_threshold "$FILE")" >> "$GITHUB_OUTPUT"

      - name: hadolint
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          if [[ ! -f "${{ inputs.dockerfile }}" ]]; then
            echo "Skip hadolint — Dockerfile absent"
            exit 0
          fi
          hadolint --failure-threshold "${{ steps.thr.outputs.hadolint }}" \
            "${{ inputs.dockerfile }}"

      - name: structure-test stub
        if: inputs.structure_test_config != ''
        continue-on-error: ${{ env.ADVISORY == 'true' }}
        run: |
          # Stub: validate config YAML parses; full image build is opt-in elsewhere.
          if [[ ! -f "${{ inputs.structure_test_config }}" ]]; then
            echo "structure_test_config missing: ${{ inputs.structure_test_config }}" >&2
            exit 1
          fi
          echo "structure-test config present: ${{ inputs.structure_test_config }}"
          echo "::notice::CDO-006 stub — run container-build for a real image + CST"
